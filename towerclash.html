<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TOWER CLASH</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; color: #eaf3ff; font-family: system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, 160vh); aspect-ratio: 16 / 10; }
  canvas { width: 100%; height: 100%; display: block; background: #0a1020; }
  #ui { position: absolute; inset: 0; display: none; align-items: flex-start; justify-content: center; background: rgba(4,7,16,.9); overflow: auto; }
  #ui.on { display: flex; }
  .panel { width: min(760px, 96%); padding: 16px; text-align: center; box-sizing: border-box; margin: auto; }
  h1 { font-size: 44px; margin: 0 0 6px; letter-spacing: 3px; color: #ffcf6a; text-shadow: 0 0 18px #ff8a2a; }
  h2 { margin: 0 0 6px; } h3 { margin: 12px 0 4px; color: #9fd0ff; }
  .muted { color: #8fa3c8; font-size: 13px; line-height: 1.45; }
  button { font: inherit; font-weight: 700; color: #fff; background: #2a6fe0; border: 0; border-radius: 8px; padding: 7px 14px; margin: 3px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.red { background: #c0364a; } button.green { background: #2a9a5a; } button.big { font-size: 20px; padding: 12px 30px; background: #d8642a; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; background: #121c3c; border: 1px solid #2d3b6a; border-radius: 8px; padding: 6px 10px; margin: 4px 0; font-size: 13px; }
  .row b { color: #ffe27a; }
  #slots { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: none; gap: 6px; }
  body.play #slots { display: flex; }
  #slots button { min-width: 70px; padding: 6px 8px; font-size: 12px; background: #16203a; border: 2px solid #3a5aa8; }
  #slots button.sel { border-color: #ffe27a; background: #2a3a6a; }
  #cbar { position: absolute; right: 8px; bottom: 8px; display: none; gap: 4px; }
  body.play #cbar { display: flex; }
  #pauseBtn { position: absolute; left: 8px; top: 8px; display: none; background: #10182fcc; padding: 4px 10px; margin: 0; font-size: 14px; }
  body.play #pauseBtn { display: block; }
</style></head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="960" height="600"></canvas>
  <div id="slots"></div>
  <div id="cbar"><button id="rotL">◀</button><button id="rotR">▶</button><button id="zIn">＋</button><button id="zOut">－</button></div>
  <button id="pauseBtn">❚❚</button>
  <div id="ui"></div>
</div></div>
<script>
/* ===== Dratenzo wallet: ONE coin balance shared by every game (same-origin localStorage) ===== */
const Wallet = (() => {
  const KEY = "dratenzo-wallet-v1";
  let mem = { coins: 0, m: {} }, loaded = false, pill = null, pop = null, popT = 0;
  const read = () => { if (loaded) return mem; loaded = true; try { const r = localStorage.getItem(KEY); if (r) { const d = JSON.parse(r); if (d && typeof d.coins === "number") mem = { coins: d.coins, m: d.m || {} }; } } catch (e) {} return mem; };
  const write = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} };
  const css = "position:fixed;left:8px;bottom:8px;z-index:2147483000;background:rgba(15,20,35,.82);color:#ffd54a;border:1px solid rgba(255,213,74,.5);border-radius:999px;padding:4px 12px;font:700 14px system-ui,sans-serif;pointer-events:none;box-shadow:0 0 10px rgba(255,213,74,.25)";
  function mount() {
    if (pill || !document.body) return;
    pill = document.createElement("div"); pill.id = "wallet-pill"; pill.style.cssText = css;
    pop = document.createElement("div"); pop.style.cssText = css.replace("bottom:8px", "bottom:44px") + ";opacity:0;transition:opacity .3s;color:#9affb0;border-color:rgba(154,255,176,.5)";
    document.body.appendChild(pill); document.body.appendChild(pop); api.refresh();
  }
  const api = {
    get() { return Math.floor(read().coins); },
    set(n) { read(); mem.coins = Math.max(0, Math.floor(n) || 0); write(); api.refresh(); },
    add(n) { api.set(api.get() + n); },
    earn(n, why) { n = Math.floor(n); if (!(n > 0)) return; api.add(n); api.pop("+" + n + " 🪙" + (why ? " " + why : "")); },
    floor(n) { if (api.get() < n) api.set(n); },
    migrate(game, legacy) { read(); if (mem.m[game]) return; mem.m[game] = 1; mem.coins += Math.max(0, Math.floor(legacy) || 0); write(); },
    bind(obj, prop, game) { api.migrate(game, obj[prop]); Object.defineProperty(obj, prop, { get: () => api.get(), set: v => api.set(v), enumerable: true, configurable: true }); api.refresh(); },
    refresh() { if (pill) pill.textContent = "🪙 " + api.get(); },
    pop(t) { if (!pop) return; pop.textContent = t; pop.style.opacity = 1; clearTimeout(popT); popT = setTimeout(() => { pop.style.opacity = 0; }, 1400); },
  };
  window.addEventListener("storage", e => { if (e.key === KEY) { loaded = false; api.refresh(); } });
  if (document.body) mount(); else document.addEventListener("DOMContentLoaded", mount);
  return api;
})();
/* ===== end wallet ===== */


const W = 960, H = 600, SAVE_KEY = "towerclash-save-v1";
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), ui = document.getElementById("ui");
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hyp = Math.hypot;

// ================= save =================
let S;
const defaultSave = () => ({ lvl: 1, xp: 0, scrap: 60, cores: 0, uid: 1, items: [{ uid: 0, w: "cannon" }], slots: [0], mods: [], best: 0, kills: 0, codes: [], name: "Bastion" });
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

S = load();

// ================= data =================
const WP = {
  cannon: { n: "Cannon", d: "Reliable direct-fire shell.", cost: [0, 0], rate: .8, dmg: 22, spd: 75, col: "#ffd35a", r: .6, kind: "bullet", en: 0 },
  mg: { n: "Machine Gun", d: "Rapid, low-damage bullets.", cost: [30, 0], rate: .1, dmg: 5, spd: 100, spread: .035, col: "#ffe9a0", r: .35, kind: "bullet", en: 0 },
  flak: { n: "Flak Burst", d: "Pellet spray; also shoots down enemy missiles.", cost: [70, 0], rate: .9, dmg: 6, pellets: 8, spread: .16, spd: 80, life: .5, col: "#ff9a3a", kind: "flak", en: 0 },
  mortar: { n: "Mortar", d: "Lobbed explosive shell with area damage.", cost: [60, 0], rate: 1.6, dmg: 45, aoe: 7, spd: 45, grav: 30, col: "#9aff6a", r: .8, kind: "arc", en: 0 },
  missile: { n: "Missile Pod", d: "Fires 4 homing missiles.", cost: [110, 0], rate: 2, dmg: 16, burst: 4, aoe: 3, spd: 38, col: "#ff6a6a", r: .5, kind: "missile", en: 6 },
  laser: { n: "Laser", d: "Continuous beam. Drains energy while firing.", cost: [140, 0], dps: 70, range: 60, kind: "beam", col: "#6affff", enps: 30 },
  tesla: { n: "Tesla Coil", d: "Chain lightning to 3 nearby towers.", cost: [150, 0], rate: .45, dmg: 28, range: 28, chain: 3, kind: "tesla", col: "#c28aff", en: 6 },
  rail: { n: "Railgun", d: "Hitscan slug that pierces every tower in line.", cost: [220, 1], rate: 2.2, dmg: 130, kind: "rail", col: "#ffffff", en: 25 },
  plasma: { n: "Plasma Cannon", d: "Slow, huge explosive plasma ball.", cost: [300, 2], rate: 1.5, dmg: 85, aoe: 6, spd: 55, col: "#ff5ad8", r: 1.1, kind: "bullet", en: 20 },
};
const MD = {
  shield: { n: "Shield Generator", d: "Adds a regenerating shield.", cost: [90, 0] },
  repair: { n: "Repair Beacon", d: "Repairs your tower over time.", cost: [100, 0] },
  charger: { n: "Overcharger", d: "+25% damage and faster energy recharge.", cost: [130, 1] },
  plating: { n: "Reactive Plating", d: "+40% max health.", cost: [80, 0] },
};
const ET = {
  scout: { n: "Scout", hp: 60, r: 2.4, h: 7, col: [200, 140, 90], spd: 4, pref: 22, range: 36, rate: 1.4, wp: "bullet", dmg: 7, xp: 6, sc: 5 },
  gunner: { n: "Gunner", hp: 120, r: 3, h: 8, col: [130, 130, 200], spd: 2.6, pref: 20, range: 32, rate: .18, wp: "bullet", dmg: 2.6, xp: 9, sc: 7 },
  mortar: { n: "Mortar", hp: 110, r: 3, h: 6, col: [110, 200, 110], spd: 1.5, pref: 42, range: 62, rate: 3, wp: "arc", dmg: 26, xp: 12, sc: 9 },
  missile: { n: "Missile", hp: 150, r: 3, h: 9, col: [200, 90, 90], spd: 1.6, pref: 36, range: 58, rate: 4, wp: "missile", dmg: 8, xp: 14, sc: 11 },
  sniper: { n: "Sniper", hp: 90, r: 2.5, h: 12, col: [90, 200, 200], spd: 1, pref: 52, range: 70, rate: 3.6, wp: "rail", dmg: 36, xp: 16, sc: 13 },
  brute: { n: "Brute", hp: 420, r: 4.2, h: 9, col: [160, 90, 140], spd: 1.4, pref: 16, range: 26, rate: 1.1, wp: "bullet", dmg: 13, xp: 24, sc: 20 },
  boss: { n: "Fortress", hp: 1800, r: 6.5, h: 15, col: [216, 72, 58], spd: .9, pref: 30, range: 72, rate: 1.6, wp: "boss", dmg: 14, xp: 120, sc: 80 },
};
const lvlNeed = l => 50 + 40 * (l - 1);
const slotCount = () => Math.min(6, 2 + Math.floor((S.lvl - 1) / 2) + 0), modCount = () => (S.lvl >= 6 ? 3 : 2);
const hpMax = () => (200 + 45 * (S.lvl - 1)) * (hasMod("plating") ? 1.4 : 1), enMax = () => 100 + 10 * S.lvl;
const dmgMult = () => (1 + .06 * (S.lvl - 1)) * (hasMod("charger") ? 1.25 : 1);
const hasMod = id => S.mods.some(u => (S.items.find(i => i.uid === u) || {}).w === id);
const itemOf = uid => S.items.find(i => i.uid === uid);

// ================= state =================
let mode = "title", wave = 0, enemies = [], shots = [], fx = [], floats = [], P = null, tm = 0, shake = 0, sel = 0, runScrap = 0, runKills = 0, hover = null, msg = "", msgT = 0, aimW = null;
const mouse = { x: W / 2, y: H / 2, down: false }, keys = new Set();
const cam = { yaw: .62, pitch: -.62, roll: .09, dist: 50, fov: 62 * Math.PI / 180 };
const say = (t, d = 2) => { msg = t; msgT = d; };

function newRun() {
  wave = 0; runScrap = 0; runKills = 0; shots = []; fx = []; floats = []; enemies = [];
  P = { x: 0, z: 0, hp: hpMax(), sh: shieldMax(), en: enMax(), yaw: 0, cds: [], hit: 0, hitT: 0, beam: null };
  sel = 0; nextWave();
}
const shieldMax = () => (hasMod("shield") ? 80 + 25 * S.lvl : 0);

// ================= 3D camera =================
let B, F;
function camBasis() {
  const c = Math.cos(cam.pitch), s = Math.sin(cam.pitch), sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
  const f = { x: c * sy, y: s, z: c * cy }, r = { x: cy, y: 0, z: -sy }, u = { x: -s * sy, y: c, z: -s * cy };
  const cr = Math.cos(cam.roll), sr = Math.sin(cam.roll);
  const r2 = { x: r.x * cr + u.x * sr, y: r.y * cr + u.y * sr, z: r.z * cr + u.z * sr }, u2 = { x: u.x * cr - r.x * sr, y: u.y * cr - r.y * sr, z: u.z * cr - r.z * sr };
  B = { f, r: r2, u: u2, pos: { x: (P ? P.x : 0) - f.x * cam.dist, y: 5 - f.y * cam.dist, z: (P ? P.z : 0) - f.z * cam.dist } };
  F = (H / 2) / Math.tan(cam.fov / 2);
}
function toCam(x, y, z) { const vx = x - B.pos.x, vy = y - B.pos.y, vz = z - B.pos.z; return { x: vx * B.r.x + vy * B.r.y + vz * B.r.z, y: vx * B.u.x + vy * B.u.y + vz * B.u.z, z: vx * B.f.x + vy * B.f.y + vz * B.f.z }; }
function clipNear(poly) { const out = [], N = .5; for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length], ai = a.z >= N, bi = b.z >= N; if (ai) out.push(a); if (ai !== bi) { const t = (N - a.z) / (b.z - a.z); out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: N }); } } return out; }
const scr = p => [W / 2 + p.x / p.z * F, H / 2 - p.y / p.z * F];
function pt(x, y, z) { const c = toCam(x, y, z); if (c.z < .5) return null; return { x: W / 2 + c.x / c.z * F, y: H / 2 - c.y / c.z * F, z: c.z, s: F / c.z }; }
function poly3(pts, fill, stroke, alpha) {
  let c = clipNear(pts.map(p => toCam(p[0], p[1], p[2]))); if (c.length < 3) return;
  ctx.beginPath(); c.forEach((p, i) => { const [x, y] = scr(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
  if (alpha !== undefined) ctx.globalAlpha = alpha; if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); } ctx.globalAlpha = 1;
}
function line3(a, b, col, w, alpha) {
  let p = toCam(a[0], a[1], a[2]), q = toCam(b[0], b[1], b[2]); const N = .5;
  if (p.z < N && q.z < N) return; if (p.z < N) { const t = (N - p.z) / (q.z - p.z); p = { x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t, z: N }; } else if (q.z < N) { const t = (N - q.z) / (p.z - q.z); q = { x: q.x + (p.x - q.x) * t, y: q.y + (p.y - q.y) * t, z: N }; }
  const [x1, y1] = scr(p), [x2, y2] = scr(q); ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.strokeStyle = col; ctx.lineWidth = w || 1; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.globalAlpha = 1; ctx.lineWidth = 1;
}
const LDIR = (() => { const l = hyp(-.4, .85, -.3); return { x: -.4 / l, y: .85 / l, z: -.3 / l }; })();
const shade = (c, k) => `rgb(${Math.min(255, c[0] * k) | 0},${Math.min(255, c[1] * k) | 0},${Math.min(255, c[2] * k) | 0})`;
function face(pts, n, col, edge) {
  const cx = (pts[0][0] + pts[2][0]) / 2, cy = (pts[0][1] + pts[2][1]) / 2, cz = (pts[0][2] + pts[2][2]) / 2;
  if ((B.pos.x - cx) * n[0] + (B.pos.y - cy) * n[1] + (B.pos.z - cz) * n[2] <= 0) return;
  const k = .38 + .62 * Math.max(0, n[0] * LDIR.x + n[1] * LDIR.y + n[2] * LDIR.z);
  poly3(pts, shade(col, k), edge || "rgba(0,0,0,.35)");
}
function prism(cx, cz, y0, y1, r, n, rot, col, r1) {
  const t = r1 === undefined ? r : r1, bot = [], top = [];
  for (let i = 0; i < n; i++) { const a = rot + i / n * 6.2832; bot.push([cx + Math.cos(a) * r, y0, cz + Math.sin(a) * r]); top.push([cx + Math.cos(a) * t, y1, cz + Math.sin(a) * t]); }
  for (let i = 0; i < n; i++) { const j = (i + 1) % n, am = rot + (i + .5) / n * 6.2832; face([bot[i], bot[j], top[j], top[i]], [Math.cos(am), .1, Math.sin(am)], col); }
  if (B.pos.y > y1) poly3(top, shade(col, 1.05), "rgba(0,0,0,.35)");
}
function box(cx, cy, cz, sx, sy, sz, yaw, col) {
  const c = Math.cos(yaw), s = Math.sin(yaw), hx = sx / 2, hy = sy / 2, hz = sz / 2;
  const P3 = (x, y, z) => [cx + x * c + z * s, cy + y, cz - x * s + z * c], N = (x, y, z) => [x * c + z * s, y, -x * s + z * c];
  face([P3(-hx, -hy, hz), P3(hx, -hy, hz), P3(hx, hy, hz), P3(-hx, hy, hz)], N(0, 0, 1), col);
  face([P3(hx, -hy, -hz), P3(-hx, -hy, -hz), P3(-hx, hy, -hz), P3(hx, hy, -hz)], N(0, 0, -1), col);
  face([P3(hx, -hy, hz), P3(hx, -hy, -hz), P3(hx, hy, -hz), P3(hx, hy, hz)], N(1, 0, 0), col);
  face([P3(-hx, -hy, -hz), P3(-hx, -hy, hz), P3(-hx, hy, hz), P3(-hx, hy, -hz)], N(-1, 0, 0), col);
  face([P3(-hx, hy, hz), P3(hx, hy, hz), P3(hx, hy, -hz), P3(-hx, hy, -hz)], N(0, 1, 0), col);
}
function unproject(mx, my) {
  const nx = (mx - W / 2) / F, ny = (H / 2 - my) / F, d = { x: B.f.x + B.r.x * nx + B.u.x * ny, y: B.f.y + B.r.y * nx + B.u.y * ny, z: B.f.z + B.r.z * nx + B.u.z * ny };
  return { o: B.pos, d };
}
function groundPoint(mx, my) { const { o, d } = unproject(mx, my); if (d.y >= -.001) return null; const t = -o.y / d.y; return { x: o.x + d.x * t, y: 0, z: o.z + d.z * t }; }

// ================= input =================
addEventListener("keydown", e => {
  const k = e.key.toLowerCase(); if ([" ", "arrowleft", "arrowright", "arrowup", "arrowdown"].includes(k)) e.preventDefault();
  if (mode === "play" && !e.repeat) { if (/^[1-6]$/.test(k)) selSlot(+k - 1); if (k === "p" || k === "escape") pauseGame(); if (k === "c") openWorkshop(true); }
  else if ((mode === "pause" || mode === "shop") && !e.repeat && (k === "p" || k === "escape") && P && wave > 0 && !shopLocked) resumeGame();
  keys.add(k);
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); mouse.down = false; });
function setMouse(e) { const r = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; mouse.x = (t.clientX - r.left) * W / r.width; mouse.y = (t.clientY - r.top) * H / r.height; }
let rdrag = false, rlast = null;
cv.addEventListener("mousemove", e => { if (rdrag && rlast) { cam.yaw += (e.clientX - rlast.x) * .008; cam.pitch = clamp(cam.pitch + (e.clientY - rlast.y) * .005, -1.1, -.3); rlast = { x: e.clientX, y: e.clientY }; } setMouse(e); });
addEventListener("mouseup", e => { if (e.button === 2) rdrag = false; });
cv.addEventListener("mousedown", e => { setMouse(e); if (e.button === 0) mouse.down = true; if (e.button === 2) { rdrag = true; rlast = { x: e.clientX, y: e.clientY }; } });
addEventListener("mouseup", () => { mouse.down = false; });
cv.addEventListener("touchstart", e => { e.preventDefault(); setMouse(e); mouse.down = true; }, { passive: false });
cv.addEventListener("touchmove", e => { e.preventDefault(); setMouse(e); }, { passive: false });
cv.addEventListener("touchend", () => { mouse.down = false; });
cv.addEventListener("wheel", e => { e.preventDefault(); cam.dist = clamp(cam.dist + e.deltaY * .03, 28, 80); }, { passive: false });
cv.addEventListener("contextmenu", e => e.preventDefault());
const hold = (id, f) => { const b = document.getElementById(id); let iv = null; b.addEventListener("pointerdown", e => { e.preventDefault(); f(); iv = setInterval(f, 40); }); for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => { clearInterval(iv); }); };
hold("rotL", () => cam.yaw -= .04); hold("rotR", () => cam.yaw += .04); hold("zIn", () => cam.dist = clamp(cam.dist - 1, 28, 80)); hold("zOut", () => cam.dist = clamp(cam.dist + 1, 28, 80));
document.getElementById("pauseBtn").addEventListener("click", () => mode === "play" && pauseGame());
function selSlot(i) { if (i < slotCount()) { sel = i; renderSlots(); } }

// ================= waves =================
function spawnTower(type, scale) {
  const T = ET[type], a = rnd(0, 6.283), d = rnd(52, 64), w = wave;
  const hpS = 1 + .2 * w, dmS = 1 + .1 * w;
  enemies.push({ type, x: (P ? P.x : 0) + Math.cos(a) * d, z: (P ? P.z : 0) + Math.sin(a) * d, hp: T.hp * hpS * (scale || 1), max: T.hp * hpS * (scale || 1), r: T.r, h: T.h, cd: rnd(1, 2.5), dm: T.dmg * dmS, yaw: 0, flash: 0, ph: 0, slow: 0, burn: 0 });
}
function nextWave() {
  wave++; shots = []; const boss = wave % 5 === 0, n = Math.min(12, 3 + Math.floor(wave * 1.3));
  const pool = ["scout"]; if (wave >= 2) pool.push("gunner"); if (wave >= 3) pool.push("mortar"); if (wave >= 4) pool.push("missile"); if (wave >= 6) pool.push("sniper", "brute"); if (wave >= 9) pool.push("brute", "sniper");
  if (boss) spawnTower("boss"); for (let i = 0; i < (boss ? Math.floor(n / 2) : n); i++) spawnTower(pool[Math.floor(Math.random() * pool.length)]);
  say(boss ? `WAVE ${wave} — FORTRESS` : `WAVE ${wave}`, 2.4); mode = "play"; document.body.classList.add("play"); ui.classList.remove("on"); renderSlots();
}

// ================= weapons =================
const muzzle = () => ({ x: P.x + Math.cos(P.yaw) * 2.5, y: 11, z: P.z + Math.sin(P.yaw) * 2.5 });

    for (let i = 0; i < n; i++) { const it = itemOf(S.slots[i]); if (!it) continue; const off = (i - (n - 1) / 2) * 1.1, w = WP[it.w], c = hexToRgb(w.col); const cx = -Math.sin(ang) * 0 + Math.cos(ang) * off * 0; const px = Math.cos(yaw), pz = Math.sin(yaw), rx = -pz, rz = px; box(X + px * 3.2 + rx * off, 11.3 + (i % 2) * .5, Z + pz * 3.2 + rz * off, .8, .8, 4.5 + (it.w === "rail" || it.w === "mortar" ? 2 : 0), ang, c); }
  }
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function drawEnemy(e) {
  const T = ET[e.type], c = e.flash > 0 ? [255, 255, 255] : T.col, ang = Math.PI / 2 - e.yaw;
  poly3(circlePts(e.x, e.z, e.r * 1.2, 14), "rgba(0,0,0,.35)");
  prism(e.x, e.z, 0, e.h * .55, e.r, 10, .3, c.map(v => v * .7), e.r * .85); prism(e.x, e.z, e.h * .55, e.h, e.r * .8, 10, .3, c, e.r * .6);
  const px = Math.cos(e.yaw), pz = Math.sin(e.yaw);
  box(e.x, e.h + e.r * .3, e.z, e.r * 1.1, e.r * .6, e.r * 1.1, ang, c.map(v => v * 1.15));
  box(e.x + px * e.r * .9, e.h + e.r * .3, e.z + pz * e.r * .9, e.r * .35, e.r * .35, e.r * 1.6, ang, [60, 60, 70]);
  const t = pt(e.x, e.h + e.r + 2, e.z); if (t) { const w = Math.max(24, e.r * t.s * 2); ctx.fillStyle = "#000a"; ctx.fillRect(t.x - w / 2, t.y - 6, w, 5); ctx.fillStyle = e.type === "boss" ? "#ff5a5a" : "#e44"; ctx.fillRect(t.x - w / 2, t.y - 6, w * clamp(e.hp / e.max, 0, 1), 5); }
}
function drawShot(s) {
  const p = pt(s.x, s.y, s.z); if (!p) return; const rr = Math.max(2, s.r * p.s * (s.rail ? 1 : 1.2));
  if (s.px !== undefined) line3([s.px, s.py, s.pz], [s.x, s.y, s.z], s.col, Math.max(1.5, rr * .8), .6);
  ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 7); ctx.fill();
  if (s.groundOnly || s.aoe) { const g = pt(s.x, 0, s.z); if (g) { ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(g.x, g.y, rr, rr * .45, 0, 0, 7); ctx.fill(); } }
}
function drawFx(f) {
  const k = f.t / f.max;
  if (f.k === "boom") { const p = pt(f.x, f.y, f.z); if (!p) return; ctx.globalAlpha = k; ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(p.x, p.y, f.r * p.s * (1.1 - k * .6), 0, 7); ctx.fill(); ctx.globalAlpha = k * .8; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1; ctx.globalAlpha = 1; }
  else if (f.k === "bolt") { ctx.globalAlpha = k; line3([f.a.x, f.a.y, f.a.z], [f.b.x, f.b.y, f.b.z], f.c, f.w || 3); ctx.globalAlpha = 1; }
}
function bar(x, y, w, h, f, c, label) { ctx.fillStyle = "#000a"; ctx.fillRect(x, y, w, h); ctx.fillStyle = c; ctx.fillRect(x, y, w * clamp(f, 0, 1), h); ctx.strokeStyle = "#fff4"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1); if (label) { ctx.fillStyle = "#fff"; ctx.font = "11px system-ui"; ctx.textAlign = "left"; ctx.fillText(label, x + 4, y + h - 3); } }
function hud() {
  if (!P) return;
  bar(60, 12, 230, 16, P.hp / hpMax(), "#e44a5a", "Hull " + Math.ceil(P.hp) + " / " + Math.round(hpMax()));
  if (shieldMax()) bar(60, 31, 230, 10, P.sh / shieldMax(), "#5ac8ff", "Shield " + Math.ceil(P.sh));
  bar(60, shieldMax() ? 44 : 31, 230, 10, P.en / enMax(), "#ffd54a", "Energy " + Math.floor(P.en));
  ctx.fillStyle = "#fff"; ctx.font = "bold 14px system-ui"; ctx.textAlign = "left"; ctx.fillText(`${S.name}  ·  Power Lv ${S.lvl}`, 60, shieldMax() ? 70 : 58);
  bar(60, shieldMax() ? 76 : 64, 230, 8, S.xp / lvlNeed(S.lvl), "#9f7aff");
  ctx.textAlign = "center"; ctx.font = "bold 20px system-ui"; ctx.fillStyle = "#eef2ff"; ctx.fillText(`WAVE ${wave}`, W / 2, 28); ctx.font = "12px system-ui"; ctx.fillStyle = "#93a0c8"; ctx.fillText(`${enemies.length} enemy tower${enemies.length === 1 ? "" : "s"} left`, W / 2, 46);
  ctx.textAlign = "right"; ctx.font = "bold 14px system-ui"; ctx.fillStyle = "#ffe27a"; ctx.fillText(`⚙ ${S.scrap} scrap`, W - 150, 24); ctx.fillStyle = "#6af0ff"; ctx.fillText(`◆ ${S.cores} cores`, W - 150, 44);
  // radar
  const rx = W - 70, ry = 70, rr = 56; ctx.fillStyle = "#000a"; ctx.beginPath(); ctx.arc(rx, ry, rr, 0, 7); ctx.fill(); ctx.strokeStyle = "#5fae6a"; ctx.beginPath(); ctx.arc(rx, ry, rr, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(rx, ry, rr / 2, 0, 7); ctx.stroke();
  for (const e of enemies) { const dx = e.x - P.x, dz = e.z - P.z, c = Math.cos(-cam.yaw), s = Math.sin(-cam.yaw), x = dx * c - dz * s, y = dx * s + dz * c; ctx.fillStyle = e.type === "boss" ? "#ff4a4a" : "#ffb04a"; ctx.fillRect(rx + x / 70 * rr - 2, ry - y / 70 * rr - 2, 4, 4); } ctx.fillStyle = "#fff"; ctx.fillRect(rx - 3, ry - 3, 6, 6);
  ctx.textAlign = "center"; ctx.font = "12px system-ui"; ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.fillText("WASD move · Mouse aim · Click fire selected (1-6) · Space fire all · Right-drag rotate view · Wheel zoom · C workshop · P pause", W / 2, H - 52);
  if (msgT > 0) { ctx.font = "bold 34px system-ui"; ctx.fillStyle = "#fff"; ctx.globalAlpha = Math.min(1, msgT); ctx.fillText(msg, W / 2, 120); ctx.globalAlpha = 1; }
}
function renderSlots() {
  const el = document.getElementById("slots"); el.innerHTML = "";
  for (let i = 0; i < slotCount(); i++) { const it = itemOf(S.slots[i]), b = document.createElement("button"); b.textContent = (i + 1) + ": " + (it ? WP[it.w].n : "—"); if (i === sel) b.className = "sel"; b.addEventListener("pointerdown", e => { e.preventDefault(); selSlot(i); }); el.appendChild(b); }
}

// ================= menus & workshop =================
function show(html) { ui.innerHTML = `<div class="panel">${html}</div>`; ui.classList.add("on"); }
function showTitle() {
  mode = "title"; document.body.classList.remove("play");
  show(`<h1>TOWER CLASH</h1><p class="muted">You are a tower. Rotate your turret, blast enemy towers in a full 3D arena, harvest scrap, then <b>craft</b> new weapons — or <b>decraft</b> old ones to get most of the scrap back. Every kill makes your tower more powerful.</p>
  <p>Name your tower:<br><input id="tn" maxlength="14" value="${S.name.replace(/"/g, "")}" style="font:inherit;font-size:17px;padding:7px 12px;border-radius:8px;border:2px solid #3a5aa8;background:#0e1630;color:#fff;text-align:center;width:220px"></p>
  
  <button class="big" data-act="start">Fight!</button> <button data-act="shop0">Workshop</button>
  <p class="muted">Level ${S.lvl} · ${S.scrap} scrap · ${S.cores} cores · best wave ${S.best}<br>WASD move · mouse aim · click to fire the selected weapon · 1-6 select · Space fire all · right-click drag rotates the view · wheel zoom</p>`);
}
function pauseGame() { if (mode !== "play") return; mode = "pause"; mouse.down = false; show(`<h1 style="font-size:30px">PAUSED</h1><button class="big" data-act="resume">Resume</button> <button data-act="shop1">Workshop</button> <button class="red" data-act="title">Quit run</button>`); }
function resumeGame() { shopLocked = false; mode = "play"; ui.classList.remove("on"); document.body.classList.add("play"); renderSlots(); }
const costTxt = c => `${c[0]} ⚙${c[1] ? " + " + c[1] + " ◆" : ""}`;
function refund(c) { return [Math.floor(c[0] * .7), Math.floor(c[1] * .5)]; }
let shopFrom = "title";
function openWorkshop(inRun) {
  shopFrom = inRun === true ? "run" : inRun === false ? "wave" : inRun; if (mode === "play") { mode = "shop"; mouse.down = false; } else if (mode !== "shop" && mode !== "pause") mode = "shop"; mode = "shop";
  const nS = slotCount(), nM = modCount();
  const equipped = new Set(S.slots.concat(S.mods));
  const itemName = i => (WP[i.w] || MD[i.w]).n;
  const slotRows = Array.from({ length: nS }, (_, i) => { const it = itemOf(S.slots[i]); return `<div class="row"><span>Mount ${i + 1}: <b>${it ? itemName(it) : "— empty —"}</b></span>${it ? `<button data-act="unequip" data-id="${it.uid}">Unequip</button>` : ""}</div>`; }).join("");
  const modRows = Array.from({ length: nM }, (_, i) => { const it = itemOf(S.mods[i]); return `<div class="row"><span>Module ${i + 1}: <b>${it ? itemName(it) : "— empty —"}</b></span>${it ? `<button data-act="unequip" data-id="${it.uid}">Unequip</button>` : ""}</div>`; }).join("");
  const inv = S.items.map(it => { const d = WP[it.w] || MD[it.w], r = refund(d.cost), eq = equipped.has(it.uid); return `<div class="row"><span><b>${itemName(it)}</b>${eq ? " <i>(equipped)</i>" : ""}<br><span class="muted">${d.d}</span></span><span>${eq ? "" : `<button class="green" data-act="equip" data-id="${it.uid}">Equip</button>`}<button class="red" data-act="decraft" data-id="${it.uid}">Decraft +${costTxt(r)}</button></span></div>`; }).join("") || `<p class="muted">No items.</p>`;
  const rec = Object.entries(WP).map(([id, w]) => craftRow(id, w)).concat(Object.entries(MD).map(([id, w]) => craftRow(id, w))).join("");
  const next = shopFrom === "wave";
  show(`<h2>⚙ Workshop</h2><p class="muted">Power Lv <b>${S.lvl}</b> (${S.xp}/${lvlNeed(S.lvl)} xp) · <b style="color:#ffe27a">${S.scrap} scrap</b> · <b style="color:#6af0ff">${S.cores} cores</b> · ${nS} weapon mounts, ${nM} module slots</p>
  <h3>Mounted weapons</h3>${slotRows}<h3>Modules</h3>${modRows}<h3>Inventory (decraft returns 70% scrap, 50% cores)</h3>${inv}<h3>Blueprints — craft</h3>${rec}
  <p>${next ? `<button class="big" data-act="deploy">Deploy — Wave ${wave + 1}</button>` : shopFrom === "run" ? `<button class="big" data-act="resume">Back to battle</button>` : `<button class="big" data-act="title">Done</button>`}</p>`);
}
function craftRow(id, d) { const ok = S.scrap >= d.cost[0] && S.cores >= d.cost[1]; return `<div class="row"><span><b>${d.n}</b> <span class="muted">${costTxt(d.cost)}</span><br><span class="muted">${d.d}</span></span><button data-act="craft" data-id="${id}" ${ok ? "" : "disabled"}>Craft</button></div>`; }
function doAct(act, id) {
  if (act === "craft") { const d = WP[id] || MD[id]; if (S.scrap < d.cost[0] || S.cores < d.cost[1]) return; S.scrap -= d.cost[0]; S.cores -= d.cost[1]; const it = { uid: S.uid++, w: id }; S.items.push(it); autoEquip(it); save(); openWorkshop(shopFrom); }
  else if (act === "decraft") { const uid = +id, it = itemOf(uid); if (!it) return; const d = WP[it.w] || MD[it.w], r = refund(d.cost); S.scrap += r[0]; S.cores += r[1]; S.items = S.items.filter(i => i.uid !== uid); S.slots = S.slots.filter(u => u !== uid); S.mods = S.mods.filter(u => u !== uid); save(); openWorkshop(shopFrom); }
  else if (act === "equip") { autoEquip(itemOf(+id), true); save(); openWorkshop(shopFrom); }
  else if (act === "unequip") { const uid = +id; S.slots = S.slots.filter(u => u !== uid); S.mods = S.mods.filter(u => u !== uid); save(); openWorkshop(shopFrom); }
}
function autoEquip(it, force) {
  if (WP[it.w]) { if (S.slots.length < slotCount()) S.slots.push(it.uid); else if (force) { S.slots[slotCount() - 1] = it.uid; } }
  else if (S.mods.length < modCount()) S.mods.push(it.uid); else if (force) S.mods[modCount() - 1] = it.uid;
  S.slots = S.slots.filter(u => itemOf(u)); S.mods = S.mods.filter(u => itemOf(u));
}
ui.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return; const a = t.dataset.act;
  if (["craft", "decraft", "equip", "unequip"].includes(a)) return doAct(a, t.dataset.id);
  switch (a) {
    case "start": { const n = document.getElementById("tn"); if (n) S.name = (n.value.trim() || "Bastion").slice(0, 14); save(); newRun(); break; }
    case "again": newRun(); break;
    case "deploy": shopLocked = false; P.hp = Math.min(hpMax(), P.hp); P.en = enMax(); P.sh = shieldMax(); P.cds = []; sel = Math.min(sel, slotCount() - 1); nextWave(); break;
    case "resume": resumeGame(); break;

  }
});
let last = 0;
function loop(now) { const dt = Math.min(.033, (now - last) / 1000 || 0); last = now; update(dt); draw(); requestAnimationFrame(loop); }
camBasis(); showTitle(); requestAnimationFrame(loop);

</script>
