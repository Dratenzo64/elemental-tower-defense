<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dratenzo Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: 'Rajdhani', system-ui, sans-serif;
    color: #fff;
    padding: 32px 20px 60px;
    background:
      radial-gradient(circle at 20% 10%, #8e24aa 0%, transparent 60%),
      radial-gradient(circle at 80% 90%, #6a1b9a 0%, transparent 60%),
      linear-gradient(135deg, #2d0a4a 0%, #4a148c 40%, #6a1b9a 100%);
    background-attachment: fixed;
  }
  h1, h2, h3, .heading, .game-title, .game-genre, .play-button, .tab, .coming-soon, .game-icon {
    font-family: 'Orbitron', monospace;
    font-weight: 700;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(34px, 6vw, 54px);
    letter-spacing: 2px;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5), 0 0 40px rgba(186, 104, 255, 0.4);
    margin-bottom: 6px;
  }
  .subtitle {
    color: rgba(255, 255, 255, 0.7);
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  .tabs {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 36px;
    flex-wrap: wrap;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }
  .tab {
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.15);
    color: white;
    padding: 10px 22px;
    border-radius: 24px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.18s;
    font-family: inherit;
  }
  .tab:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.3);
  }
  .tab.active {
    background: #fff;
    color: #6a1b9a;
    border-color: #fff;
    box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
  }
  .games-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 22px;
  }
  .game-card {
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 22px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
  }
  .game-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, transparent 0%, rgba(255, 255, 255, 0.06) 100%);
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .game-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    border-color: rgba(255, 255, 255, 0.32);
  }
  .game-card:hover::before { opacity: 1; }
  .game-icon {
    font-size: 42px;
    letter-spacing: 6px;
    text-align: center;
    line-height: 1;
    margin: 12px 0 8px;
    padding: 18px 4px;
    border-radius: 10px;
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  /* Element Tower Defense — each letter IS an element */
  .icon-etd span {
    display: inline-block;
    position: relative;
    font-family: 'Orbitron', monospace;
    font-weight: 900;
  }
  /* E — on FIRE (orange-yellow gradient + flickering flame shadow) */
  .icon-etd .l1 {
    background: linear-gradient(180deg, #fff096 0%, #ff9a3d 35%, #ff4a1e 70%, #b81f0a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: etd-fire-flicker 0.9s infinite alternate;
  }
  .icon-etd .l1::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -10px;
    width: 28px;
    height: 14px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at bottom, rgba(255, 220, 100, 0.85) 0%, rgba(255, 140, 0, 0.55) 30%, rgba(255, 70, 0, 0) 70%);
    filter: blur(2px);
    animation: etd-fire-dance 0.6s infinite alternate;
    pointer-events: none;
  }
  @keyframes etd-fire-flicker {
    0%   { filter: drop-shadow(0 -4px 6px #ff8a3d) drop-shadow(0 0 10px #ff4a1e); }
    50%  { filter: drop-shadow(0 -7px 12px #ffb060) drop-shadow(0 0 14px #ff6b35); }
    100% { filter: drop-shadow(0 -5px 8px #ff5018) drop-shadow(0 0 8px #ff4a1e); }
  }
  @keyframes etd-fire-dance {
    0%   { transform: translateX(-50%) scaleY(1)   scaleX(1);    opacity: 0.85; }
    50%  { transform: translateX(-55%) scaleY(1.3) scaleX(0.85); opacity: 1; }
    100% { transform: translateX(-45%) scaleY(0.9) scaleX(1.1);  opacity: 0.7; }
  }
  /* T — WET (blue gradient + glossy highlight + falling water drop) */
  .icon-etd .l2 {
    background: linear-gradient(180deg, #d6ecff 0%, #5ab8ff 35%, #1976d2 80%, #0d47a1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: etd-water-shimmer 2.2s infinite alternate;
  }
  .icon-etd .l2::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 22%;
    width: 6px;
    height: 14px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0));
    border-radius: 50%;
    transform: rotate(-15deg);
    pointer-events: none;
  }
  .icon-etd .l2::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -14px;
    width: 7px;
    height: 9px;
    background: radial-gradient(circle at 50% 30%, #b3dcff 0%, #3aa3ff 50%, #1565c0 100%);
    border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
    transform: translateX(-50%);
    box-shadow: 0 0 6px rgba(58, 163, 255, 0.7);
    animation: etd-water-drip 2.4s infinite;
    pointer-events: none;
  }
  @keyframes etd-water-shimmer {
    0%   { filter: drop-shadow(0 3px 6px #3aa3ff) drop-shadow(0 0 10px #5fb3ff); }
    100% { filter: drop-shadow(0 5px 10px #1976d2) drop-shadow(0 0 14px #3aa3ff); }
  }
  @keyframes etd-water-drip {
    0%, 40%   { opacity: 0; transform: translate(-50%, -18px) scale(0.6); }
    50%       { opacity: 1; transform: translate(-50%, -14px) scale(0.9); }
    80%       { opacity: 1; transform: translate(-50%, 6px)  scale(1); }
    100%      { opacity: 0; transform: translate(-50%, 16px) scale(1.1); }
  }
  /* D — LIGHTNING (yellow gradient + sudden zaps + electric bolt arc) */
  .icon-etd .l3 {
    background: linear-gradient(180deg, #ffffe0 0%, #ffe23a 40%, #ffb800 80%, #d68900 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: etd-lightning-zap 1.6s infinite;
  }
  .icon-etd .l3::before {
    /* tiny bolt scribble that flashes near the letter */
    content: "⚡";
    position: absolute;
    top: -14px;
    right: -8px;
    font-size: 16px;
    color: #fff8a0;
    text-shadow: 0 0 6px #ffe23a, 0 0 12px #fff;
    animation: etd-lightning-bolt 1.6s infinite;
    pointer-events: none;
  }
  @keyframes etd-lightning-zap {
    0%, 100%  { filter: drop-shadow(0 0 8px #ffe23a); }
    8%, 10%   { filter: drop-shadow(0 0 18px #ffffff) drop-shadow(0 0 28px #ffe23a); }
    55%       { filter: drop-shadow(0 0 10px #ffe23a); }
    62%, 64%  { filter: drop-shadow(0 0 16px #ffffff) drop-shadow(0 0 22px #ffe23a); }
  }
  @keyframes etd-lightning-bolt {
    0%, 100%  { opacity: 0; transform: scale(0.7) rotate(-10deg); }
    8%, 12%   { opacity: 1; transform: scale(1.2) rotate(10deg); }
    20%       { opacity: 0; }
    60%, 64%  { opacity: 1; transform: scale(1.1) rotate(-15deg); }
    72%       { opacity: 0; }
  }
  /* Mazebreaker — each letter is its own puzzle piece block */
  .icon-mbk { gap: 4px; padding: 12px 4px; }
  .icon-mbk span {
    display: inline-block;
    width: 38px;
    height: 38px;
    line-height: 38px;
    border-radius: 6px;
    color: #1a0533;
    box-shadow:
      inset 0 -3px 0 rgba(0, 0, 0, 0.18),
      inset 0 3px 0 rgba(255, 255, 255, 0.3),
      0 4px 10px rgba(0, 0, 0, 0.35);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);
    font-size: 22px;
    letter-spacing: 0;
    transform: rotate(-3deg);
    border: 1.5px solid rgba(0, 0, 0, 0.18);
  }
  .icon-mbk .p1 { background: #00bcd4; transform: rotate(-4deg); }
  .icon-mbk .p2 { background: #ff9800; transform: rotate(2deg); }
  .icon-mbk .p3 { background: #66bb6a; transform: rotate(-2deg); }
  /* Slipshot — neon green action letters with a target/crosshair vibe */
  .icon-slp {
    letter-spacing: 8px;
    padding: 18px 8px;
    border-color: rgba(74, 222, 128, 0.35);
    position: relative;
    overflow: visible;
  }
  .icon-slp span {
    color: #4ade80;
    text-shadow:
      0 0 10px #4ade80,
      0 0 20px rgba(74, 222, 128, 0.7),
      0 0 32px rgba(74, 222, 128, 0.4);
    display: inline-block;
    animation: slp-glow 2s infinite alternate;
    position: relative;
  }
  .icon-slp .s2 { animation-delay: 0.25s; }
  .icon-slp .s3 { animation-delay: 0.5s; }
  /* tiny crosshair sweeping across the icon */
  .icon-slp::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    width: 18px;
    height: 18px;
    border: 1.5px solid #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 12px #4ade80;
    transform: translate(0, -50%);
    animation: slp-target 3.5s infinite ease-in-out;
    pointer-events: none;
  }
  @keyframes slp-glow {
    0%   { filter: brightness(1)    drop-shadow(0 0 4px #4ade80); }
    100% { filter: brightness(1.25) drop-shadow(0 0 14px #4ade80); }
  }
  @keyframes slp-target {
    0%, 100% { left: 6%;  opacity: 0.5; transform: translate(0, -50%) scale(1); }
    45%      { left: 92%; opacity: 1;   transform: translate(-100%, -50%) scale(1.15); }
    55%      { left: 92%; opacity: 1;   transform: translate(-100%, -50%) scale(1.15); }
  }
  /* PixelQuest — chunky pixel letters with a retro RPG vibe */
  .icon-pxq {
    letter-spacing: 4px;
    padding: 16px 4px;
    border-color: rgba(252, 211, 77, 0.35);
    font-family: 'Press Start 2P', 'Orbitron', monospace !important;
    position: relative;
    background: linear-gradient(180deg, rgba(252, 211, 77, 0.08) 0%, rgba(67, 36, 24, 0.2) 100%);
  }
  .icon-pxq span {
    display: inline-block;
    font-family: 'Press Start 2P', 'Orbitron', monospace !important;
    font-size: 26px;
    color: #fcd34d;
    text-shadow:
      3px 3px 0 #432418,
      0 0 10px rgba(252, 211, 77, 0.55);
    image-rendering: pixelated;
    animation: pxq-bob 1.4s infinite ease-in-out;
  }
  .icon-pxq .q2 { animation-delay: 0.15s; color: #4ade80; text-shadow: 3px 3px 0 #1a3d22, 0 0 10px rgba(74, 222, 128, 0.5); }
  .icon-pxq .q3 { animation-delay: 0.3s;  color: #60a5fa; text-shadow: 3px 3px 0 #1a2c45, 0 0 10px rgba(96, 165, 250, 0.5); }
  /* tiny pixel sword bobbing in the background */
  .icon-pxq::before {
    content: "";
    position: absolute;
    top: 6px;
    right: 10px;
    width: 4px;
    height: 18px;
    background:
      linear-gradient(180deg,
        #cdd9e6 0%, #cdd9e6 70%,
        #8a6038 70%, #8a6038 100%);
    box-shadow:
      -3px 4px 0 #cdd9e6,
       3px 4px 0 #cdd9e6,
      -3px 14px 0 #8a6038,
       3px 14px 0 #8a6038;
    transform: rotate(35deg);
    animation: pxq-sword 2.4s infinite ease-in-out;
    pointer-events: none;
  }
  /* tiny pixel coin sparkle */
  .icon-pxq::after {
    content: "";
    position: absolute;
    bottom: 8px;
    left: 14px;
    width: 6px;
    height: 6px;
    background: #fcd34d;
    box-shadow:
      0 -6px 0 0 transparent,
      0 0 6px 1px #fcd34d,
      6px 0 0 -2px #fcd34d,
      -6px 0 0 -2px #fcd34d;
    border-radius: 50%;
    animation: pxq-coin 1.6s infinite ease-in-out;
    pointer-events: none;
  }
  @keyframes pxq-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes pxq-sword {
    0%, 100% { transform: rotate(35deg) translateY(0); }
    50%      { transform: rotate(40deg) translateY(-2px); }
  }
  @keyframes pxq-coin {
    0%, 100% { transform: scale(1)   rotate(0deg);   opacity: 0.9; }
    50%      { transform: scale(0.4) rotate(180deg); opacity: 0.5; }
  }
  /* PokéQuiz — red/white Pokéball-inspired letters */
  .icon-pkq {
    background: linear-gradient(180deg, #ee1515 0%, #f0f0f0 50%, #f0f0f0 100%);
    border-color: rgba(238, 21, 21, 0.55);
    padding: 14px 4px;
    position: relative;
    overflow: visible;
  }
  .icon-pkq span {
    display: inline-block;
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    color: #1a1a1a;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.5), 0 0 8px rgba(238,21,21,0.4);
    animation: pkq-bob 1.5s infinite ease-in-out;
  }
  .icon-pkq .k2 { animation-delay: 0.2s; }
  .icon-pkq .k3 { animation-delay: 0.4s; }
  /* horizontal Pokéball equator line */
  .icon-pkq::before {
    content: "";
    position: absolute;
    left: 6%;
    right: 6%;
    top: 50%;
    height: 3px;
    background: #1a1a1a;
    transform: translateY(-1.5px);
    pointer-events: none;
  }
  /* center Pokéball button */
  .icon-pkq::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 14px;
    background: #f0f0f0;
    border: 3px solid #1a1a1a;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 6px rgba(255,255,255,0.8);
    animation: pkq-blink 2.4s infinite;
    pointer-events: none;
  }
  @keyframes pkq-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes pkq-blink {
    0%, 45%, 55%, 100% { background: #f0f0f0; box-shadow: 0 0 6px rgba(255,255,255,0.8); }
    50%                { background: #ee1515; box-shadow: 0 0 10px rgba(238,21,21,0.85); }
  }
  /* Dragonforge — fiery DRG letters with flame wisps */
  .icon-drg {
    background: linear-gradient(180deg, rgba(255,90,30,0.12) 0%, rgba(40,15,5,0.4) 100%);
    border-color: rgba(255, 110, 40, 0.45);
    padding: 14px 4px;
    position: relative;
    overflow: visible;
  }
  .icon-drg span {
    display: inline-block;
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    background: linear-gradient(180deg, #ffe88a 0%, #ff8c30 45%, #d6391a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 14px rgba(255, 120, 40, 0.6);
    animation: drg-flicker 1.4s infinite alternate;
    position: relative;
  }
  .icon-drg .d2 { animation-delay: 0.18s; }
  .icon-drg .d3 { animation-delay: 0.36s; }
  /* upward flame wisps near top of icon */
  .icon-drg::before {
    content: "";
    position: absolute;
    top: -8px; left: 50%; transform: translateX(-50%);
    width: 60%;
    height: 14px;
    background:
      radial-gradient(ellipse at 20% 100%, rgba(255,160,40,0.6) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(255,90,20,0.6) 0%, transparent 60%);
    filter: blur(3px);
    animation: drg-flame 1s infinite alternate;
    pointer-events: none;
  }
  /* tiny dragon scale glints below */
  .icon-drg::after {
    content: "";
    position: absolute;
    bottom: 6px;
    left: 22%;
    width: 10px; height: 4px;
    background:
      radial-gradient(ellipse, rgba(255,200,80,0.85) 0%, transparent 70%);
    box-shadow:
      18px 1px 0 0 rgba(255,150,40,0.7),
      36px 0 0 0 rgba(255,200,80,0.85);
    filter: blur(0.5px);
    animation: drg-glint 2s infinite;
    pointer-events: none;
  }
  @keyframes drg-flicker {
    0%   { filter: drop-shadow(0 0 4px #ff7a30); transform: translateY(0); }
    100% { filter: drop-shadow(0 0 12px #ffb060) drop-shadow(0 0 18px #ff5a1a); transform: translateY(-1px); }
  }
  @keyframes drg-flame {
    0%   { transform: translateX(-50%) scaleY(1);   opacity: 0.85; }
    100% { transform: translateX(-50%) scaleY(1.5); opacity: 1; }
  }
  @keyframes drg-glint {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }
  /* Drazelect — DRZ letters cycling through all 18 Pokémon type colors */
  .icon-drz {
    background: linear-gradient(180deg, rgba(150,50,180,0.15) 0%, rgba(20,10,30,0.45) 100%);
    border-color: rgba(200, 120, 255, 0.55);
    padding: 16px 6px;
    letter-spacing: 6px;
    position: relative;
    overflow: visible;
  }
  .icon-drz span {
    display: inline-block;
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    animation: drz-cycle 6s infinite linear;
  }
  .icon-drz .z1 { animation-delay: 0s;   }
  .icon-drz .z2 { animation-delay: 2s;   }
  .icon-drz .z3 { animation-delay: 4s;   }
  @keyframes drz-cycle {
    0%   { color: #ff6030; text-shadow: 0 0 12px #ff6030; }       /* fire */
    11%  { color: #4488ff; text-shadow: 0 0 12px #4488ff; }       /* water */
    22%  { color: #88ff44; text-shadow: 0 0 12px #88ff44; }       /* grass */
    33%  { color: #ffdd00; text-shadow: 0 0 12px #ffdd00; }       /* electric */
    44%  { color: #7fd4ff; text-shadow: 0 0 12px #7fd4ff; }       /* ice */
    55%  { color: #a060c0; text-shadow: 0 0 12px #a060c0; }       /* poison */
    66%  { color: #f070c0; text-shadow: 0 0 12px #f070c0; }       /* psychic */
    77%  { color: #8060ff; text-shadow: 0 0 12px #8060ff; }       /* dragon */
    88%  { color: #ff90d0; text-shadow: 0 0 12px #ff90d0; }       /* fairy */
    100% { color: #ff6030; text-shadow: 0 0 12px #ff6030; }
  }
  /* small sparkle ring around the icon */
  .icon-drz::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 80%; height: 80%;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.35) 0%, transparent 8%),
      radial-gradient(circle at 80% 60%, rgba(255,255,255,0.35) 0%, transparent 8%),
      radial-gradient(circle at 60% 20%, rgba(255,255,255,0.35) 0%, transparent 8%);
    animation: drz-sparkle 3s infinite alternate;
    pointer-events: none;
  }
  @keyframes drz-sparkle {
    0%   { opacity: 0.4; transform: translate(-50%, -50%) rotate(0deg); }
    100% { opacity: 1; transform: translate(-50%, -50%) rotate(15deg); }
  }
  /* Wyrmfire — dragon-red WRM letters with fireball breath */
  .icon-wrm {
    background: linear-gradient(180deg, rgba(150,20,10,0.15) 0%, rgba(20,5,5,0.4) 100%);
    border-color: rgba(214, 112, 48, 0.55);
    padding: 16px 6px;
    letter-spacing: 5px;
    position: relative;
    overflow: visible;
  }
  .icon-wrm span {
    display: inline-block;
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    background: linear-gradient(180deg, #ffe088 0%, #ff6030 45%, #a01810 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 12px rgba(255, 100, 30, 0.7);
    animation: wrm-breathe 1.6s infinite alternate;
    position: relative;
  }
  .icon-wrm .w2 { animation-delay: 0.2s; }
  .icon-wrm .w3 { animation-delay: 0.4s; }
  /* Fireball orbiting the icon */
  .icon-wrm::before {
    content: "";
    position: absolute;
    top: 50%; left: 0;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff2a0 0%, #ff9030 40%, #d61510 80%, transparent 100%);
    box-shadow: 0 0 12px #ff6030, 0 0 22px rgba(255,120,40,0.6);
    animation: wrm-fireball 3s infinite linear;
    pointer-events: none;
  }
  /* Dragon wing silhouettes flapping behind */
  .icon-wrm::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 70%;
    height: 22px;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(ellipse at 15% 50%, rgba(120,30,10,0.4) 0%, transparent 65%),
      radial-gradient(ellipse at 85% 50%, rgba(120,30,10,0.4) 0%, transparent 65%);
    filter: blur(1px);
    animation: wrm-wing 0.7s infinite alternate;
    pointer-events: none;
    z-index: -1;
  }
  @keyframes wrm-breathe {
    0%   { filter: drop-shadow(0 0 4px #ff6030); transform: translateY(0); }
    100% { filter: drop-shadow(0 0 14px #ffa060) drop-shadow(0 0 20px #d61510); transform: translateY(-1px); }
  }
  @keyframes wrm-fireball {
    0%   { transform: translate(0, -50%)      scale(1); }
    25%  { transform: translate(60px, -180%)  scale(1.15); }
    50%  { transform: translate(150px, -50%)  scale(1); }
    75%  { transform: translate(60px, 80%)    scale(0.85); }
    100% { transform: translate(0, -50%)      scale(1); }
  }
  @keyframes wrm-wing {
    0%   { transform: translate(-50%, -50%) scaleY(0.9); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scaleY(1.4); opacity: 1; }
  }
  .game-genre {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }
  .game-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
  }
  .game-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    background: rgba(186, 104, 255, 0.25);
    border: 1px solid rgba(186, 104, 255, 0.4);
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .game-description {
    flex: 1;
    font-size: 14px;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.85);
  }
  .play-button {
    background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
    color: #fff;
    border: none;
    padding: 14px 28px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    display: inline-block;
    box-shadow: 0 6px 16px rgba(76, 175, 80, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    letter-spacing: 0.5px;
    margin-top: 4px;
    font-family: inherit;
  }
  .play-button:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 10px 22px rgba(76, 175, 80, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  .play-button:active { transform: translateY(0); }
  .coming-soon {
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.55);
    padding: 14px 28px;
    border-radius: 14px;
    font-size: 14px;
    text-align: center;
    font-style: italic;
    font-weight: 600;
    margin-top: 4px;
    border: 1px dashed rgba(255, 255, 255, 0.2);
  }
  .no-games {
    text-align: center;
    color: rgba(255, 255, 255, 0.6);
    font-size: 16px;
    padding: 60px 20px;
    grid-column: 1 / -1;
    font-style: italic;
  }
  footer {
    text-align: center;
    color: rgba(255, 255, 255, 0.4);
    font-size: 12px;
    margin-top: 50px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <h1>DRATENZO GAMES</h1>
  <p class="subtitle">// FREE INDIE WEB GAMES · NO INSTALLS, JUST PLAY //</p>
</header>

<div class="tabs" id="tabs">
  <button class="tab active" data-category="all">All Games</button>
  <button class="tab" data-category="tower-defense">Tower Defense</button>
  <button class="tab" data-category="puzzle">Puzzle</button>
  <button class="tab" data-category="action">Action</button>
  <button class="tab" data-category="adventure">Adventure</button>
</div>

<div class="games-grid" id="games-grid"></div>

<footer>© <span id="year"></span> Dratenzo Games · Built with love</footer>

<script>
// ============================================================
// GAME LIBRARY — add new entries here as you build more games.
// Set `available: false` to show "Coming Soon" instead of a play button.
// ============================================================
const games = [
  {
    title: "Element Tower Defense",
    icon: "ETD",
    iconHtml: '<div class="game-icon icon-etd"><span class="l1">E</span><span class="l2">T</span><span class="l3">D</span></div>',
    genre: "Tower Defense",
    category: "tower-defense",
    description: "Defend against waves of enemies by placing element towers and merging them into stronger combinations. Discover 33 unique elements across 5 tiers — from basic Fire and Water all the way to apex tier-5 ultimates like Singularity, Apocalypse, and Eternity. Survive 10 scripted waves, then face endless mode where voids crack open across the field.",
    tags: ["33 Elements", "5 Tiers", "Endless Mode", "Drag to Merge"],
    url: "element-tower-defense.html",
    available: true,
  },
  {
    title: "Mazebreaker",
    icon: "MBK",
    iconHtml: '<div class="game-icon icon-mbk"><span class="p1">M</span><span class="p2">B</span><span class="p3">K</span></div>',
    genre: "Puzzle",
    category: "puzzle",
    description: "Navigate 24 hand-crafted maze levels with arrow keys or WASD. Dodge deadly spikes and find the glowing exit. Levels 11-20 are pitch-dark fog mazes that reveal as you walk near them. Levels 21-24 add bounce pads — step on a yellow pad and your next move launches you 3 cells in that direction, flying safely over walls and spikes. Progress saves automatically.",
    tags: ["24 Levels", "Fog of War", "Bounce Pads", "Spikes"],
    url: "mazebreaker.html",
    available: true,
  },
  {
    title: "Slipshot",
    icon: "SLP",
    iconHtml: '<div class="game-icon icon-slp"><span class="s1">S</span><span class="s2">L</span><span class="s3">P</span></div>',
    genre: "Action",
    category: "action",
    description: "Top-down sliding action. You're a green circle on an icy floor — momentum carries you. Dodge bullets from hexagonal towers and the melee enemies that chase you down. Hold the mouse to aim while time slows around you, then release to fire a 3-bullet burst. One shot kills a tower or enemy. Survive as long as you can.",
    tags: ["Bullet Time", "Ice Physics", "Burst Fire", "Endless"],
    url: "slipshot.html",
    available: true,
  },
  {
    title: "PixelQuest",
    icon: "PXQ",
    iconHtml: '<div class="game-icon icon-pxq"><span class="q1">P</span><span class="q2">X</span><span class="q3">Q</span></div>',
    genre: "Adventure",
    category: "adventure",
    description: "A pixelated wave-survival adventure inspired by classic Pokemon. Start with a random common weapon — ranged weapons auto-fire every 0.5s, melee weapons spin around you and bleed enemies. After each wave you earn coins and roll a power-up with rarity weights (40% common, 20% rare, 10% epic, 5% legendary, rest re-roll). Stack lightning/fire/poison/ice orbs, lightning strikes, healing auras and more. Every 10 waves you reach the City of Emberfall to roll new weapons and explore.",
    tags: ["Pixel Art", "Wave Survival", "Loot Rarity", "City Visits"],
    url: "pixelquest.html",
    available: true,
  },
  {
    title: "PokéQuiz",
    icon: "PKQ",
    iconHtml: '<div class="game-icon icon-pkq"><span class="k1">P</span><span class="k2">K</span><span class="k3">Q</span></div>',
    genre: "Puzzle",
    category: "puzzle",
    description: "A silhouette-guessing Pokémon quiz. Pick which generations, legendaries, mythicals, and regional variants (Alolan Raichu, Galarian Meowth, Hisuian Zoroark, and more) you want to include. Every question shows a black silhouette — type the Pokémon name, its region, and its type to score up to 25 points. Zoom-in hints give you a clue but halve the points. 25 questions per quiz, best score saved.",
    tags: ["Silhouettes", "9 Generations", "Legendaries", "Regional Forms"],
    url: "pokequiz.html",
    available: true,
  },
  {
    title: "Drazelect",
    icon: "DRZ",
    iconHtml: '<div class="game-icon icon-drz"><span class="z1">D</span><span class="z2">R</span><span class="z3">Z</span></div>',
    genre: "Action",
    category: "action",
    description: "You are a dragon armed with Pokémon moves. Pick your starting move from all 18 types — Tackle, Ember, Water Gun, Razor Leaf, Thunder Shock, Ice Shard, Karate Chop, Poison Sting, Mud-Slap, Gust, Confusion, Bug Bite, Rock Throw, Lick, Dragon Breath, Bite, Metal Claw, or Fairy Wind. Level up killing monsters; every 10 levels unlocks a new ability slot. Die to earn coins for the Dragon's Hoard, where you can buy elite moves like Flamethrower, Ice Beam, Shadow Ball, Solar Beam, Blizzard, Draco Meteor, Hyper Beam, and legendary Psystrike. Remap any slot to any key you want.",
    tags: ["All 18 Types", "30+ Moves", "Custom Keys", "Roguelite"],
    url: "drazelect.html",
    available: true,
  },
];

// ============================================================
// RENDERING — no changes needed below.
// ============================================================
const tabs = document.getElementById("tabs");
const grid = document.getElementById("games-grid");
let currentCategory = "all";

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function render() {
  grid.innerHTML = "";
  const filtered = currentCategory === "all"
    ? games
    : games.filter(g => g.category === currentCategory);

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-games">No games in this category yet. Check back soon!</div>';
    return;
  }

  for (const g of filtered) {
    const card = document.createElement("div");
    card.className = "game-card";
    const tagsHtml = (g.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
    const action = g.available
      ? `<a href="${escapeHtml(g.url)}" class="play-button">PLAY ›</a>`
      : `<div class="coming-soon">Coming Soon</div>`;
    const iconBlock = g.iconHtml || `<div class="game-icon">${escapeHtml(g.icon)}</div>`;
    card.innerHTML = `
      ${iconBlock}
      <div class="game-genre">${escapeHtml(g.genre)}</div>
      <div class="game-title">${escapeHtml(g.title)}</div>
      <div class="game-tags">${tagsHtml}</div>
      <div class="game-description">${escapeHtml(g.description)}</div>
      ${action}
    `;
    grid.appendChild(card);
  }
}

tabs.addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  for (const t of tabs.children) t.classList.remove("active");
  btn.classList.add("active");
  currentCategory = btn.dataset.category;
  render();
});

document.getElementById("year").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
