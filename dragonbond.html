<script>
/* ===== Dratenzo wallet: ONE coin balance shared by every game (same-origin localStorage) ===== */
const Wallet = (() => {
  const KEY = "dratenzo-wallet-v1";
  let mem = { coins: 0, m: {} }, loaded = false, pill = null, pop = null, popT = 0;
  const read = () => { if (loaded) return mem; loaded = true; try { const r = localStorage.getItem(KEY); if (r) { const d = JSON.parse(r); if (d && typeof d.coins === "number") mem = { coins: d.coins, m: d.m || {} }; } } catch (e) {} return mem; };
  const write = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} };
  const css = "position:fixed;left:8px;bottom:8px;z-index:2147483000;background:rgba(15,20,35,.82);color:#ffd54a;border:1px solid rgba(255,213,74,.5);border-radius:999px;padding:4px 12px;font:700 14px system-ui,sans-serif;pointer-events:none;box-shadow:0 0 10px rgba(255,213,74,.25)";
  function mount() {
    if (pill || !document.body) return;
    pill = document.createElement("div"); pill.id = "wallet-pill"; pill.style.cssText = css;
    pop = document.createElement("div"); pop.style.cssText = css.replace("bottom:8px", "bottom:44px") + ";opacity:0;transition:opacity .3s;color:#9affb0;border-color:rgba(154,255,176,.5)";
    document.body.appendChild(pill); document.body.appendChild(pop); api.refresh();
  }
  const api = {
    get() { return Math.floor(read().coins); },
    set(n) { read(); mem.coins = Math.max(0, Math.floor(n) || 0); write(); api.refresh(); },
    add(n) { api.set(api.get() + n); },
    earn(n, why) { n = Math.floor(n); if (!(n > 0)) return; api.add(n); api.pop("+" + n + " 🪙" + (why ? " " + why : "")); },
    floor(n) { if (api.get() < n) api.set(n); },
    migrate(game, legacy) { read(); if (mem.m[game]) return; mem.m[game] = 1; mem.coins += Math.max(0, Math.floor(legacy) || 0); write(); },
    bind(obj, prop, game) { api.migrate(game, obj[prop]); Object.defineProperty(obj, prop, { get: () => api.get(), set: v => api.set(v), enumerable: true, configurable: true }); api.refresh(); },
    refresh() { if (pill) pill.textContent = "🪙 " + api.get(); },
    pop(t) { if (!pop) return; pop.textContent = t; pop.style.opacity = 1; clearTimeout(popT); popT = setTimeout(() => { pop.style.opacity = 0; }, 1400); },
  };
  window.addEventListener("storage", e => { if (e.key === KEY) { loaded = false; api.refresh(); } });
  if (document.body) mount(); else document.addEventListener("DOMContentLoaded", mount);
  return api;
})();
/* ===== end wallet ===== */


const VW = 960, VH = 600, WW = 2400, WH = 1600;
const SAVE_KEY = "dragonbond-save-v2";
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), ui = document.getElementById("ui");
const rnd = (a, b) => a + Math.random() * (b - a), dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y), clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- save ----------
let S = null;
const defaultSave = () => ({ has: false, dname: "Ember", el: "fire", start: "fire", xp: 0, lvl: 1, pts: 0, rank: {}, learned: {}, chests: {}, boss: false, kills: 0 });
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const r = localStorage.getItem(SAVE_KEY); if (r) return Object.assign(defaultSave(), JSON.parse(r)); } catch (e) {} return null; }

// ---------- elements ----------
const EORDER = ["fire", "ice", "storm", "earth", "venom", "shadow", "light"];
const ELS = {
  fire: { n: "Fire", c: "#ff7a2a", c2: "#ffd36a", b: "Flame Breath", st: "burns enemies" },
  ice: { n: "Ice", c: "#7ad8ff", c2: "#e8fbff", b: "Frost Breath", st: "slows enemies" },
  storm: { n: "Storm", c: "#c28aff", c2: "#fff27a", b: "Lightning Breath", st: "chains between enemies" },
  earth: { n: "Earth", c: "#a8803a", c2: "#d8c08a", b: "Stone Spray", st: "heavy knockback" },
  venom: { n: "Venom", c: "#6ad84a", c2: "#d8ff8a", b: "Toxic Spit", st: "poisons enemies" },

const elLevel = k => { if (k === S.start) return 1; const others = EORDER.filter(x => x !== S.start); return [2, 3, 4, 5, 6, 8][others.indexOf(k)]; };
const elUnlocked = k => S.lvl >= elLevel(k);
const WEAK = { goblin: { fire: 1.5, light: 1.3, earth: .7 }, wolf: { ice: 1.5, storm: 1.3, shadow: .7 }, imp: { light: 1.5, earth: 1.3, shadow: .7 }, golem: { storm: 1.5, ice: 1.3, earth: .5, venom: .7 }, boss: { light: 1.3, fire: 1.1, shadow: .6, venom: .8 } };

// ---------- generic powers ----------
const POW = {
  breath: { n: "Breath", req: 1, key: "Click", d: "Hold to unleash your element in a stream.", cd: 0 },
  dash: { n: "Wing Dash", req: 2, key: "Shift", d: "An invulnerable charge that hurts and applies your element.", cd: 2.5 },
  sweep: { n: "Tail Sweep", req: 3, key: "Space", d: "A spinning elemental tail strike around you.", cd: 3 },
  roar: { n: "Roar", req: 4, key: "Q", d: "Stuns every enemy nearby for 3 seconds.", cd: 12 },
  shield: { n: "Scale Shield", req: 5, key: "E", d: "Scales harden and absorb all damage for a few seconds.", cd: 6 },
  nova: { n: "Elemental Nova", req: 7, key: "R", d: "A huge explosion of your element. Costs 30 energy.", cd: 25 },
};
const PORD = ["breath", "dash", "sweep", "roar", "shield", "nova"];
const SLOTS = ["f", "c", "v"], SREQ = [3, 5, 8], SCOST = [15, 20, 35];
// signature elemental skills: [name, description, cooldown]
const SIG = {
  fire: [["Fireball", "A blazing fireball that explodes on impact.", 4], ["Flame Wall", "A wall of fire that burns anything crossing it.", 9], ["Meteor Rain", "Call meteors down on the cursor.", 18]],
  ice: [["Ice Lance", "A piercing shard that freezes whoever it hits.", 4], ["Frost Ring", "A freezing burst around you that slows enemies.", 8], ["Blizzard", "A storm zone at the cursor that damages and slows.", 18]],
  storm: [["Chain Lightning", "A bolt that jumps between up to 6 enemies.", 5], ["Thunder Strike", "Lightning smites the cursor, stunning the area.", 9], ["Storm Cloud", "A cloud follows you, zapping enemies for 7s.", 18]],
  earth: [["Boulder", "A heavy boulder with huge knockback.", 5], ["Quake", "The ground shakes, damaging and stunning all around.", 10], ["Stone Armor", "Take 70% less damage for 6s and heal a bit.", 20]],
  venom: [["Acid Spit", "A glob that leaves a poison puddle.", 4], ["Toxic Cloud", "A lingering poison cloud around you.", 9], ["Plague", "Poisons every enemy in a wide range.", 18]],
  shadow: [["Shadow Bolt", "A homing bolt that steals life.", 4], ["Shadow Step", "Teleport toward the cursor with a burst.", 7], ["Eclipse", "Darkness stuns and damages all nearby enemies.", 20]],
  light: [["Radiant Beam", "An instant beam that pierces everything in a line.", 5], ["Healing Light", "Restore 35% of your health.", 14], ["Solar Flare", "A blinding flare: big damage and a stun.", 20]],
};
const lvlNeed = l => 40 + 40 * (l - 1);
const MAXL = 10;
const canUse = id => (tr && tr.id === id) || S.lvl >= POW[id].req || !!S.learned[id];
const rank = id => S.rank[id] || 0;
const skUnlocked = i => S.lvl >= SREQ[i];
const sm = i => (1 + .25 * rank(S.el + i)) * (1 + S.lvl * .07);

// ---------- world ----------
const TRAIN = { x: 80, y: 1050, w: 620, h: 470 };
const LAIR = { x: 1760, y: 60, w: 600, h: 450 };
const rects = [];
const R = (x, y, w, h, k) => rects.push({ x, y, w, h, k });
R(950, 450, 520, 380, "water"); R(1650, 1050, 520, 330, "water");
R(0, 340, 700, 50, "cliff");
R(1750, 60, 30, 240, "cliff"); R(1750, 400, 30, 110, "cliff"); R(1750, 480, 620, 30, "cliff");
R(200, 40, 220, 20, "cliff"); R(200, 240, 220, 20, "cliff"); R(200, 40, 20, 220, "cliff"); R(400, 40, 20, 220, "cliff");
for (const [x, y] of [[760, 700], [1100, 1100], [1500, 650], [540, 880], [1300, 1350], [880, 300], [2050, 900], [1900, 1480]]) R(x, y, 64, 64, "rock");
const CHESTS = [{ id: "c1", x: 1210, y: 640 }, { id: "c2", x: 1910, y: 1215 }, { id: "c3", x: 310, y: 150 }, { id: "c4", x: 2250, y: 420 }];
const CAMPS = [
  ["goblin", 800, 250], ["goblin", 900, 1100], ["goblin", 1200, 1200], ["goblin", 500, 700], ["goblin", 1500, 850],
  ["wolf", 600, 520], ["wolf", 1300, 1000], ["wolf", 1100, 250],
  ["imp", 1500, 300], ["imp", 2000, 800], ["imp", 1500, 1450],
  ["golem", 1650, 350], ["golem", 2050, 1500], ["golem", 1300, 1480],
  ["boss", 2150, 280],
];
const PADS = [["breath", 160], ["dash", 280], ["sweep", 400], ["roar", 520], ["shield", 640]].map(([id, x]) => ({ id, x, y: 1450, r: 40 }));
const decor = []; { let sd = 7; const rr = () => (sd = (sd * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 380; i++) decor.push({ x: rr() * WW, y: rr() * WH, s: 2 + rr() * 4 }); }
const solidAt = (x, y, r) => rects.some(b => x > b.x - r && x < b.x + b.w + r && y > b.y - r && y < b.y + b.h + r);

const ETYPES = {
  goblin: { hp: 34, r: 14, spd: 95, dmg: 8, xp: 8, coin: 2, c: "#7ac24a" },
  wolf: { hp: 28, r: 14, spd: 150, dmg: 10, xp: 10, coin: 2, c: "#9aa0b0" },
  imp: { hp: 24, r: 12, spd: 85, dmg: 7, xp: 11, coin: 3, c: "#e0508a" },
  golem: { hp: 150, r: 28, spd: 55, dmg: 22, xp: 34, coin: 8, c: "#8a7a6a" },
  boss: { hp: 1100, r: 52, spd: 90, dmg: 25, xp: 400, coin: 0, c: "#6a2a9a" },
  target: { hp: 22, r: 18, spd: 0, dmg: 0, xp: 0, coin: 0, c: "#ffd54a" },
  walker: { hp: 999, r: 15, spd: 50, dmg: 0, xp: 0, coin: 0, c: "#c8a878" },
};

// ---------- state ----------
let mode = "title", P = null, enemies = [], shots = [], fx = [], floats = [], zones = [], timers = [], camps = [], tr = null, msg = "", msgT = 0, tm = 0, shake = 0, flash = 0, padT = 0, padId = null, touch = false, dim = 0;
const cam = { x: 0, y: 0 };
const keys = new Set(), mouse = { x: VW / 2, y: VH / 2, down: false };
let cd = {};
const say = (t, d = 2.2) => { msg = t; msgT = d; };
const el = () => ELS[S.el];
const hpMax = () => 150 + 20 * S.lvl;
const enMax = () => 100 + 8 * S.lvl;

function newPlayer() {
  P = { x: 400, y: 1250, hp: hpMax(), en: enMax(), face: 0, inv: 0, dashT: 0, ddx: 0, ddy: 0, shieldT: 0, armorT: 0, trail: [], hit: new Set(), flap: 0, elCd: 0 };
  cd = {};
}
function spawnEnemy(type, x, y, extra) {
  const T = ETYPES[type];
  const e = Object.assign({ type, x, y, hx: x, hy: y, hp: T.hp, max: T.hp, r: T.r, cd: rnd(.5, 1.5), flash: 0, burn: 0, slow: 0, stun: 0, poison: 0, vx: 0, vy: 0, st: 0, t: 0, ph: 0 }, extra || {});
  enemies.push(e); return e;
}
function setupWorld() {
  enemies = []; shots = []; fx = []; floats = []; zones = []; timers = []; tr = null; padT = 0; padId = null;
  camps = CAMPS.map(([type, x, y]) => ({ type, x, y, e: null, t: 0 }));
  for (const c of camps) if (!(c.type === "boss" && S.boss)) c.e = spawnEnemy(c.type, c.x, c.y);
}
function startGame() { newPlayer(); setupWorld(); mode = "play"; ui.classList.remove("on"); document.body.classList.add("play"); say(`You are ${S.dname}, the ${el().n} dragon!`, 3); }

// ---------- input ----------
addEventListener("keydown", e => {
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright", "tab"].includes(k)) e.preventDefault();
  if (!e.repeat && mode === "play") {
    if (k === "shift") dashAct(); if (k === " ") sweepAct(); if (k === "q") roarAct(); if (k === "e") shieldAct(); if (k === "r") novaAct();
    if (k === "f") skill(0); if (k === "c") skill(1); if (k === "v") skill(2);
    if (k === "tab") cycleEl(); if (/^[1-7]$/.test(k)) setEl(EORDER[+k - 1]);
    if (k === "k") openDen(); if (k === "p" || k === "escape") pauseGame();
  } else if (!e.repeat && (mode === "den" || mode === "pause") && (k === "k" || k === "escape" || k === "p")) resumeGame();
  keys.add(k);
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); mouse.down = false; if (mode === "play") pauseGame(); });
function setMouse(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * VW / r.width; mouse.y = (e.clientY - r.top) * VH / r.height; }
cv.addEventListener("mousemove", setMouse);
cv.addEventListener("mousedown", e => { setMouse(e); if (e.button === 0) mouse.down = true; });
addEventListener("mouseup", () => { mouse.down = false; });
cv.addEventListener("contextmenu", e => e.preventDefault());
const joy = { l: null };
function setupStick() {
  const z = document.getElementById("zl"), base = z.querySelector(".base"), knob = z.querySelector(".knob");
  z.addEventListener("pointerdown", e => { touch = true; document.body.classList.add("touch"); z.setPointerCapture(e.pointerId); const r = z.getBoundingClientRect(); joy.l = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 }; base.style.display = "block"; base.style.left = (e.clientX - r.left) + "px"; base.style.top = (e.clientY - r.top) + "px"; knob.style.transform = "translate(-50%,-50%)"; });
  z.addEventListener("pointermove", e => { if (!joy.l || joy.l.id !== e.pointerId) return; const m = 60; let dx = e.clientX - joy.l.ox, dy = e.clientY - joy.l.oy; const l = Math.hypot(dx, dy); if (l > m) { dx = dx / l * m; dy = dy / l * m; } joy.l.dx = dx / m; joy.l.dy = dy / m; knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; });
  const end = e => { if (joy.l && joy.l.id === e.pointerId) { joy.l = null; base.style.display = "none"; } };
  z.addEventListener("pointerup", end); z.addEventListener("pointercancel", end);
}
setupStick();
function tbtn(id, down, up) { const b = document.getElementById(id); b.addEventListener("pointerdown", e => { e.preventDefault(); touch = true; document.body.classList.add("touch"); down(); }); if (up) for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, up); }
const pl = f => () => mode === "play" && f();
tbtn("bA", () => { mouse.down = true; }, () => { mouse.down = false; });
tbtn("bS", pl(dashAct)); tbtn("bSp", pl(sweepAct)); tbtn("bQ", pl(roarAct)); tbtn("bE", pl(shieldAct)); tbtn("bR", pl(novaAct));
tbtn("bF", pl(() => skill(0))); tbtn("bC", pl(() => skill(1))); tbtn("bV", pl(() => skill(2))); tbtn("bEl", pl(cycleEl)); tbtn("bK", pl(openDen));
document.getElementById("pauseBtn").addEventListener("click", () => mode === "play" ? pauseGame() : 0);
function aim() {
  if (touch) { let b = null, bd = 520; for (const e of enemies) { const d = dist(e, P); if (e.type !== "walker" && d < bd) { bd = d; b = e; } } if (b) return Math.atan2(b.y - P.y, b.x - P.x); return P.face; }
  return Math.atan2(mouse.y + cam.y - P.y, mouse.x + cam.x - P.x);
}
function aimPoint() { if (touch) { const a = aim(); return { x: P.x + Math.cos(a) * 240, y: P.y + Math.sin(a) * 240 }; } return { x: mouse.x + cam.x, y: mouse.y + cam.y }; }
function inputVec() {
  if (joy.l && Math.hypot(joy.l.dx, joy.l.dy) > .15) return { x: joy.l.dx, y: joy.l.dy, m: Math.min(1, Math.hypot(joy.l.dx, joy.l.dy)) };
  const dx = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0), dy = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
  const l = Math.hypot(dx, dy); return l ? { x: dx / l, y: dy / l, m: 1 } : { x: 0, y: 0, m: 0 };
}

// ---------- damage / helpers ----------
function floatText(x, y, txt, c) { floats.push({ x, y, txt, c: c || "#fff", t: .8 }); }
function puff(x, y, n, c, sp = 200) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), s = rnd(30, sp); fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.25, .7), c }); } }
function ring(x, y, max, c, life = .4) { fx.push({ ring: true, x, y, r: 10, life, max, c }); }
function line(x, y, x2, y2, c, life = .18, w = 3) { fx.push({ line: true, x, y, x2, y2, life, c, w }); }
function hitEnemy(e, dmg, elm, kx, ky, quiet) {
  if (e.type === "walker" || e.dead) return;
  const w = (WEAK[e.type] && WEAK[e.type][elm]) || 1; dmg *= w;
  e.hp -= dmg; e.flash = .1; if (kx !== undefined && e.type !== "boss") { const kk = elm === "earth" ? 2 : 1; e.vx += kx * kk; e.vy += ky * kk; }
  if (!quiet || w !== 1) floatText(e.x, e.y - e.r - 4, Math.round(dmg) + (w > 1 ? "!" : w < 1 ? "~" : ""), w > 1 ? "#ffe27a" : w < 1 ? "#8899aa" : "#fff");
  if (elm === "fire") e.burn = 3; if (elm === "ice") e.slow = 2; if (elm === "venom") e.poison = 4;

  if (msgT > 0) { ctx.textAlign = "center"; ctx.font = "bold 24px system-ui"; ctx.fillStyle = "#fff"; ctx.globalAlpha = Math.min(1, msgT); ctx.fillText(msg, VW / 2, 130); ctx.globalAlpha = 1; }
}

// ---------- menus ----------
function show(html) { ui.innerHTML = `<div class="panel">${html}</div>`; ui.classList.add("on"); }
function showTitle() {
  mode = "title"; document.body.classList.remove("play"); const sv = load();
  show(`<h1>DRAGONBOND</h1><p class="muted">You <b>are</b> the dragon. Master seven elements, learn their powers through training and battle, and face the Shadow Wyrm.</p>
  ${sv && sv.has ? `<button class="big" data-act="cont">Continue — ${sv.dname} (Lv ${sv.lvl} ${ELS[sv.el].n})</button><br>` : ""}
  <button class="${sv && sv.has ? "" : "big"}" data-act="new">${sv && sv.has ? "New game" : "Begin"}</button>
  <p class="muted" style="margin-top:14px">WASD fly · mouse aim · hold click to breathe · Shift wing dash · Space tail sweep · Q roar · E shield · R nova · <b>F / C / V</b> elemental skills · <b>1-7 / Tab</b> change element · <b>K</b> Dragon Den · P pause</p>`);
}
function showHatch() {
  mode = "title";
  show(`<h2>Your egg is hatching…</h2><p class="muted">Pick your starting element (the others unlock as you level up) and name yourself.</p>
  <div class="ups">${EORDER.map(k => `<button class="up" data-act="el" data-id="${k}" id="el_${k}" style="border-color:${ELS[k].c};width:140px"><b style="color:${ELS[k].c}">${ELS[k].n}</b>${ELS[k].b}: ${ELS[k].st}</button>`).join("")}</div>
  <p>Dragon's name:<br><input id="dn" maxlength="14" value="Ember"></p><button class="big" data-act="hatch">Hatch!</button>`);
  window._el = "fire"; setTimeout(() => pickEl("fire"), 0);
}
function pickEl(k) { window._el = k; for (const x of EORDER) { const b = document.getElementById("el_" + x); if (b) b.style.background = x === k ? "#2a3a6a" : ""; } }
function pauseGame() { if (mode !== "play") return; mode = "pause"; keys.clear(); mouse.down = false; show(`<h1 style="font-size:30px">PAUSED</h1><button class="big" data-act="resume">Resume</button> <button data-act="den">Dragon Den</button> <button class="red" data-act="title">Quit to title</button>`); }
function resumeGame() { mode = "play"; ui.classList.remove("on"); keys.clear(); }
function openDen() {
  mode = "den"; keys.clear(); mouse.down = false;
  const rowFor = (key, nm, key2, d, ok, lockTxt, by) => { const r = rank(key); return `<div style="margin:6px 0;padding:8px 10px;border:1px solid ${ok ? el().c : "#444"};border-radius:8px;opacity:${ok ? 1 : .6}"><b>${nm}</b> <span class="muted">[${key2}]</span> ${ok ? "" : `<span style="color:#ffd54a">— ${lockTxt}</span>`}<br><span class="muted">${d}</span><br>Rank ${"●".repeat(r)}${"○".repeat(3 - r)} ${ok && r < 3 && S.pts > 0 ? `<button data-act="rank" data-id="${key}">Rank up (1★)</button>` : ""}${ok && by ? ` <span class="muted">(${by})</span>` : ""}</div>`; };
  show(`<h2>🐉 Dragon Den — ${S.dname}</h2><p class="muted">Level ${S.lvl} · <b style="color:#ffe27a">★ ${S.pts} mastery points</b> (earned from first-time trials). Powers unlock by <b>level</b> or by passing their <b>trial</b>.</p>
  <div>${EORDER.map((k, i) => elUnlocked(k) ? `<button data-act="setel" data-id="${k}" style="background:${ELS[k].c};color:#111;${k === S.el ? "outline:3px solid #fff" : ""}">${i + 1} ${ELS[k].n}</button>` : `<button disabled style="background:#333;opacity:.6">${ELS[k].n} (Lv ${elLevel(k)})</button>`).join("")}</div>
  <h3 style="margin:10px 0 0;color:${el().c}">${el().n} skills</h3><div style="text-align:left">${SIG[S.el].map((s, i) => rowFor(S.el + i, s[0], SLOTS[i].toUpperCase(), s[1], skUnlocked(i), "reach level " + SREQ[i], "")).join("")}</div>
  <h3 style="margin:10px 0 0">Core powers</h3><div style="text-align:left">${PORD.map(id => rowFor(id, POW[id].n, POW[id].key, POW[id].d, canUse(id), "reach level " + POW[id].req + (id !== "breath" && id !== "nova" ? " or pass its trial" : ""), S.learned[id] ? "learned in training" : "level " + POW[id].req)).join("")}</div>
  <button class="big" data-act="resume">Back</button>`);
}
ui.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  switch (t.dataset.act) {
    case "cont": S = load(); startGame(); break;
    case "new": showHatch(); break;
    case "el": pickEl(t.dataset.id); break;
    case "hatch": S = defaultSave(); S.has = true; S.el = S.start = window._el || "fire"; S.dname = (document.getElementById("dn").value.trim() || "Ember").slice(0, 14); save(); startGame(); break;
    case "resume": resumeGame(); break;
    case "den": openDen(); break;
    case "setel": S.el = t.dataset.id; save(); openDen(); break;
    case "rank": { const id = t.dataset.id; if (S.pts > 0 && rank(id) < 3) { S.pts--; S.rank[id] = rank(id) + 1; save(); } openDen(); break; }
    case "title": save(); showTitle(); break;
  }
});
let last = 0;
function loop(now) { const dt = Math.min(.033, (now - last) / 1000 || 0); last = now; if (S) update(dt); draw(); requestAnimationFrame(loop); }
document.addEventListener("visibilitychange", () => { if (document.hidden && mode === "play") pauseGame(); });
showTitle(); requestAnimationFrame(loop);

</script>
</body></html>
