/* ===== Dratenzo wallet: ONE coin balance shared by every game (same-origin localStorage) ===== */
const Wallet = (() => {
  const KEY = "dratenzo-wallet-v1";
  let mem = { coins: 0, m: {} }, loaded = false, pill = null, pop = null, popT = 0;
  const read = () => { if (loaded) return mem; loaded = true; try { const r = localStorage.getItem(KEY); if (r) { const d = JSON.parse(r); if (d && typeof d.coins === "number") mem = { coins: d.coins, m: d.m || {} }; } } catch (e) {} return mem; };
  const write = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} };
  const css = "position:fixed;left:8px;bottom:8px;z-index:2147483000;background:rgba(15,20,35,.82);color:#ffd54a;border:1px solid rgba(255,213,74,.5);border-radius:999px;padding:4px 12px;font:700 14px system-ui,sans-serif;pointer-events:none;box-shadow:0 0 10px rgba(255,213,74,.25)";
  function mount() {
    if (pill || !document.body) return;
    pill = document.createElement("div"); pill.id = "wallet-pill"; pill.style.cssText = css;
    pop = document.createElement("div"); pop.style.cssText = css.replace("bottom:8px", "bottom:44px") + ";opacity:0;transition:opacity .3s;color:#9affb0;border-color:rgba(154,255,176,.5)";
    document.body.appendChild(pill); document.body.appendChild(pop); api.refresh();
  }
  const api = {
    get() { return Math.floor(read().coins); },
    set(n) { read(); mem.coins = Math.max(0, Math.floor(n) || 0); write(); api.refresh(); },
    add(n) { api.set(api.get() + n); },
    earn(n, why) { n = Math.floor(n); if (!(n > 0)) return; api.add(n); api.pop("+" + n + " 🪙" + (why ? " " + why : "")); },
    floor(n) { if (api.get() < n) api.set(n); },
    migrate(game, legacy) { read(); if (mem.m[game]) return; mem.m[game] = 1; mem.coins += Math.max(0, Math.floor(legacy) || 0); write(); },
    bind(obj, prop, game) { api.migrate(game, obj[prop]); Object.defineProperty(obj, prop, { get: () => api.get(), set: v => api.set(v), enumerable: true, configurable: true }); api.refresh(); },
    refresh() { if (pill) pill.textContent = "🪙 " + api.get(); },
    pop(t) { if (!pop) return; pop.textContent = t; pop.style.opacity = 1; clearTimeout(popT); popT = setTimeout(() => { pop.style.opacity = 0; }, 1400); },
  };
  window.addEventListener("storage", e => { if (e.key === KEY) { loaded = false; api.refresh(); } });
  if (document.body) mount(); else document.addEventListener("DOMContentLoaded", mount);
  return api;
})();

  bar(14, 50, 220, 10, S.lvl >= maxL() ? 1 : S.xp / lvlNeed(S.lvl), "#ffd54a"); ctx.fillStyle = "#fff"; ctx.font = "bold 13px system-ui"; ctx.textAlign = "left"; ctx.fillText(`Lv ${S.lvl}${S.pts ? "   ★ " + S.pts + " mastery pt (K)" : ""}`, 14, 76);
  // element row
  EORDER.forEach((k, i) => { const x = 14 + i * 32, ok = elUnlocked(k); ctx.fillStyle = ok ? ELS[k].c : "#333"; ctx.globalAlpha = k === S.el ? 1 : .55; ctx.beginPath(); ctx.arc(x + 13, 98, 12, 0, 7); ctx.fill(); ctx.globalAlpha = 1; if (k === S.el) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1; } ctx.fillStyle = ok ? "#111" : "#888"; ctx.font = "bold 11px system-ui"; ctx.textAlign = "center"; ctx.fillText(ok ? i + 1 : "L" + elLevel(k), x + 13, 102); });
  // abilities
  if (S.cosmic) {
    const bw = 54, x0 = VW / 2 - 10 * bw / 2;
    S.bind.forEach((b, i) => { const x = x0 + i * bw, y = VH - 62, inf = moveInfo(b.move); ctx.fillStyle = "#16203aee"; ctx.fillRect(x, y, bw - 4, 50); ctx.strokeStyle = "#ff5ad8"; ctx.strokeRect(x + .5, y + .5, bw - 5, 49); if (inf.c > 0) { ctx.fillStyle = "#000b"; ctx.fillRect(x, y, bw - 4, 50 * clamp(inf.c / inf.mx, 0, 1)); } ctx.fillStyle = "#fff"; ctx.font = "bold 9px system-ui"; ctx.textAlign = "center"; ctx.fillText(inf.label.length > 11 ? inf.label.split(" ").pop() : inf.label, x + (bw - 4) / 2, y + 22); ctx.fillStyle = "#6af0ff"; ctx.font = "bold 11px system-ui"; ctx.fillText(keyName(b.key), x + (bw - 4) / 2, y + 40); });
    ctx.fillStyle = "#fff9"; ctx.font = "12px system-ui"; ctx.textAlign = "center"; ctx.fillText("COSMIC BEING · 1-8 / Tab = element · K → Cosmic Loadout to change keys & moves", VW / 2, VH - 70);
  } else {
  const list = PORD.map(id => [id, POW[id].key, id]).concat(SLOTS.map((s, i) => ["s" + i, s.toUpperCase(), i]));
  const bw = 56, x0 = VW / 2 - list.length * bw / 2;
  list.forEach((a, i) => {
    const x = x0 + i * bw, y = VH - 62, sk = typeof a[2] === "number", id = a[0]; let ok, c, mx, label;
    if (sk) { ok = skUnlocked(a[2]); c = cd[S.el + a[2]] || 0; mx = SIG[S.el][a[2]][2]; label = SIG[S.el][a[2]][0].split(" ").pop(); } else { ok = canUse(id); c = cd[id] || 0; mx = cdOf(id) || .01; label = POW[id].n.split(" ").pop(); }
    ctx.fillStyle = ok ? "#16203aee" : "#222a"; ctx.fillRect(x, y, bw - 5, 50); ctx.strokeStyle = ok ? (sk ? el().c2 : el().c) : "#555"; ctx.strokeRect(x + .5, y + .5, bw - 6, 49);
    if (ok && c > 0) { ctx.fillStyle = "#000b"; ctx.fillRect(x, y, bw - 5, 50 * clamp(c / mx, 0, 1)); }
    ctx.fillStyle = ok ? "#fff" : "#888"; ctx.font = "bold 10px system-ui"; ctx.textAlign = "center"; ctx.fillText(label, x + (bw - 5) / 2, y + 22); ctx.fillStyle = ok ? "#9fe6ff" : "#ffd54a"; ctx.fillText(ok ? a[1] : "Lv " + (sk ? SREQ[a[2]] : POW[id].req), x + (bw - 5) / 2, y + 40);
  });
  ctx.fillStyle = "#fff9"; ctx.font = "12px system-ui"; ctx.textAlign = "center"; ctx.fillText("1-8 / Tab = change element · F C V = " + el().n + " skills", VW / 2, VH - 70);
  }
  if (tr) { ctx.fillStyle = "#000a"; ctx.fillRect(VW / 2 - 170, 14, 340, 54); ctx.fillStyle = "#ffe27a"; ctx.font = "bold 16px system-ui"; ctx.fillText(TR[tr.id].n + "  " + tr.prog + "/" + tr.goal, VW / 2, 36); ctx.fillStyle = "#fff"; ctx.font = "12px system-ui"; ctx.fillText(TR[tr.id].d + "  •  " + Math.ceil(tr.t) + "s", VW / 2, 56); }
  else if (padId && padT > 0) { ctx.fillStyle = "#fff"; ctx.font = "bold 18px system-ui"; ctx.fillText("Hold still… " + (padId === "rift" ? "Void Rift" : padId === "gate" ? "World Gate" : padId === "altar" ? "Starfall Altar" : TR[padId].n), VW / 2, 90); }
  const mw = 140, mh = mw * WH / WW, mx0 = VW - mw - 10, my0 = 10; ctx.fillStyle = "#3a6a40"; ctx.fillRect(mx0, my0, mw, mh);
  for (const b of rects) { ctx.fillStyle = b.k === "water" ? "#245a96" : "#666"; ctx.fillRect(mx0 + b.x / WW * mw, my0 + b.y / WH * mh, Math.max(1, b.w / WW * mw), Math.max(1, b.h / WH * mh)); }
  ctx.fillStyle = "#c8a85a"; ctx.fillRect(mx0 + TRAIN.x / WW * mw, my0 + TRAIN.y / WH * mh, TRAIN.w / WW * mw, TRAIN.h / WH * mh); ctx.fillStyle = "#6a3a9a"; ctx.fillRect(mx0 + LAIR.x / WW * mw, my0 + LAIR.y / WH * mh, LAIR.w / WW * mw, LAIR.h / WH * mh);
  ctx.fillStyle = "#ffd54a"; for (const c of CHESTS) if (!S.chests[c.id]) ctx.fillRect(mx0 + c.x / WW * mw - 1, my0 + c.y / WH * mh - 1, 3, 3);
  ctx.fillStyle = "#f55"; for (const e of enemies) if (e.type !== "walker" && e.type !== "target") ctx.fillRect(mx0 + e.x / WW * mw - 1, my0 + e.y / WH * mh - 1, 2, 2); ctx.fillStyle = "#fff"; ctx.fillRect(mx0 + P.x / WW * mw - 2, my0 + P.y / WH * mh - 2, 4, 4);
  ctx.fillStyle = "#fff8"; ctx.textAlign = "right"; ctx.font = "11px system-ui"; ctx.fillText("K = Dragon Den · P = pause", VW - 10, my0 + mh + 14);
  const boss = enemies.find(e => BOSSES.has(e.type)); if (boss && dist(boss, P) < 900) { bar(VW / 2 - 200, VH - 96, 400, 12, boss.hp / boss.max, "#a03ad8", ({ boss: "Shadow Wyrm", voidwyrm: "THE VOID WYRM", tyrant: "Void Tyrant", frostlord: "THE FROST LORD", stardevourer: "THE STAR DEVOURER", magmaking: "THE MAGMA KING", leviathan: "THE ABYSSAL LEVIATHAN", celestial: "THE CELESTIAL JUDGE", hydra: "THE JUNGLE HYDRA", automaton: "THE CLOCKWORK SOVEREIGN", lunarch: "THE LUNARCH", oblivion: "OBLIVION" })[boss.type]); }
  if (S.boss || WD.id > 1) { ctx.fillStyle = "#d08aff"; ctx.font = "bold 12px system-ui"; ctx.textAlign = "center"; ctx.fillText(rift ? `VOID RIFT — wave ${rift.wave}  (best ${S.rift || 0})` : WD.id === 1 ? "ASCENDED REALM — the Void spreads" : WD.name.toUpperCase(), VW / 2, 118); }
  if (msgT > 0) { ctx.textAlign = "center"; ctx.font = "bold 24px system-ui"; ctx.fillStyle = "#fff"; ctx.globalAlpha = Math.min(1, msgT); ctx.fillText(msg, VW / 2, 130); ctx.globalAlpha = 1; }
}

// ---------- menus ----------
function show(html) { ui.innerHTML = `<div class="panel">${html}</div>`; ui.classList.add("on"); }
function showTitle() {
  mode = "title"; document.body.classList.remove("play"); const sv = load();
  show(`<h1>DRAGONBOND</h1><p class="muted">You <b>are</b> the dragon. Master seven elements, learn their powers through training and battle, and face the Shadow Wyrm.</p>
  ${sv && sv.has ? `<button class="big" data-act="cont">Continue — ${sv.dname} (Lv ${sv.lvl} ${ELS[sv.el].n})</button><br>` : ""}
  <button class="${sv && sv.has ? "" : "big"}" data-act="new">${sv && sv.has ? "New game" : "Begin"}</button>
  <p class="muted" style="margin-top:14px">WASD fly · mouse aim · hold click to breathe · Shift wing dash · Space tail sweep · Q roar · E shield · R nova · <b>F / C / V</b> elemental skills · <b>1-7 / Tab</b> change element · <b>K</b> Dragon Den · P pause<br>Hold still on a World Gate to travel between worlds you have unlocked.</p>`);
}
function showHatch() {
  mode = "title";
  show(`<h2>Your egg is hatching…</h2><p class="muted">Pick your starting element (the others unlock as you level up) and name yourself.</p>
  <div class="ups">${EORDER.filter(k => k !== "cosmic").map(k => `<button class="up" data-act="el" data-id="${k}" id="el_${k}" style="border-color:${ELS[k].c};width:140px"><b style="color:${ELS[k].c}">${ELS[k].n}</b>${ELS[k].b}: ${ELS[k].st}</button>`).join("")}</div>
  <p>Dragon's name:<br><input id="dn" maxlength="14" value="Ember"></p><button class="big" data-act="hatch">Hatch!</button>`);
  window._el = "fire"; setTimeout(() => pickEl("fire"), 0);
}
function pickEl(k) { window._el = k; for (const x of EORDER.filter(k => k !== "cosmic")) { const b = document.getElementById("el_" + x); if (b) b.style.background = x === k ? "#2a3a6a" : ""; } }
function pauseGame() { if (mode !== "play") return; mode = "pause"; keys.clear(); mouse.down = false; show(`<h1 style="font-size:30px">PAUSED</h1><button class="big" data-act="resume">Resume</button> <button data-act="den">Dragon Den</button> <button data-act="vault">🔒 Vault</button> <button class="red" data-act="title">Quit to title</button>`); }
function resumeGame() { rebindSlot = null; mode = "play"; ui.classList.remove("on"); keys.clear(); }
function openDen() {
  mode = "den"; keys.clear(); mouse.down = false;
  const rowFor = (key, nm, key2, d, ok, lockTxt, by) => { const r = rank(key); return `<div style="margin:6px 0;padding:8px 10px;border:1px solid ${ok ? el().c : "#444"};border-radius:8px;opacity:${ok ? 1 : .6}"><b>${nm}</b> <span class="muted">[${key2}]</span> ${ok ? "" : `<span style="color:#ffd54a">— ${lockTxt}</span>`}<br><span class="muted">${d}</span><br>Rank ${"●".repeat(r)}${"○".repeat(rankMax() - r)} ${ok && r < rankMax() && S.pts > 0 ? `<button data-act="rank" data-id="${key}">Rank up (1★)</button>` : ""}${ok && by ? ` <span class="muted">(${by})</span>` : ""}</div>`; };
  show(`<h2>🐉 Dragon Den — ${S.dname}</h2><p class="muted">Level ${S.lvl} · <b style="color:#ffe27a">★ ${S.pts} mastery points</b> (earned from first-time trials). Powers unlock by <b>level</b> or by passing their <b>trial</b>.</p>
  <div>${EORDER.map((k, i) => elUnlocked(k) ? `<button data-act="setel" data-id="${k}" style="background:${ELS[k].c};color:#111;${k === S.el ? "outline:3px solid #fff" : ""}">${i + 1} ${ELS[k].n}</button>` : `<button disabled style="background:#333;opacity:.6">${ELS[k].n} (Lv ${elLevel(k)})</button>`).join("")}</div>
  <h3 style="margin:10px 0 0;color:${el().c}">${el().n} skills</h3><div style="text-align:left">${SIG[S.el].map((s, i) => rowFor(S.el + i, s[0], SLOTS[i].toUpperCase(), s[1], skUnlocked(i), "reach level " + SREQ[i], "")).join("")}</div>
  <h3 style="margin:10px 0 0">Core powers</h3><div style="text-align:left">${PORD.map(id => rowFor(id, POW[id].n, POW[id].key, POW[id].d, canUse(id), "reach level " + POW[id].req + (id !== "breath" && id !== "nova" ? " or pass its trial" : ""), S.learned[id] ? "learned in training" : "level " + POW[id].req)).join("")}</div>
  <div style="margin-top:8px">${S.note ? `<button data-act="note">📜 Read the note</button>` : ""}${S.boss ? `<button data-act="travel">🌍 World travel</button>` : ""}${S.cosmic ? `<button data-act="loadout" style="background:#c03aa0">✦ Cosmic loadout</button>` : ""}<button data-act="vault">🔒 Vault</button></div>
  <button class="big" data-act="resume">Back</button>`);
}
// ----- note / altar / travel / loadout -----
function openNote() {
  mode = "note"; keys.clear(); mouse.down = false;
  show(`<h2>📜 A torn page</h2><div style="text-align:left;background:#f0e4c0;color:#3a2a10;padding:16px 20px;border-radius:6px;font-family:Georgia,serif;line-height:1.55"><i>They who wander between worlds forget the fifth sky.<br>To wake it, speak the name of the wanderer.<br>Do not guess — read what each dragon's breath tells you.</i><br><br>
  <b>I.</b> The poison-breather — its <b>third</b> letter.<br><b>II.</b> The thief of life — its <b>fifth</b>.<br><b>III.</b> The one whose lightning leaps from foe to foe — its <b>last</b>.<br><b>IV.</b> The one who hurls foes backward — its <b>second</b>.<br><b>V.</b> Return to the thief of life — its <b>fourth</b>.<br><br>
  <i>Five letters, in the order written. Speak them at the altar of stars.</i></div><p class="muted">The Starfall Altar stands in the Waystone Camp of this world.</p><button class="big" data-act="resume">Close</button>`);
}
function openAltar() {
  mode = "altar"; keys.clear(); mouse.down = false;
  if (!S.note) { show(`<h2>✦ Starfall Altar</h2><p class="muted">The altar hums, but you have nothing to say to it yet.<br>Something in this world is waiting to be found…</p><button class="big" data-act="resume">Leave</button>`); return; }
  if (S.cosmic) { show(`<h2>✦ Starfall Altar</h2><p class="muted">The stars already know your name, Cosmic One.</p><button class="big" data-act="resume">Leave</button>`); return; }
  show(`<h2>✦ Starfall Altar</h2><p class="muted">Speak the name of the wanderer.</p><input id="code" maxlength="12" placeholder="?????" style="text-transform:uppercase;letter-spacing:6px"><p id="cmsg" class="muted"></p><button class="big" data-act="speak">Speak</button> <button data-act="note">📜 Read the note</button> <button data-act="resume">Leave</button>`);
  const inp = document.getElementById("code"); if (inp) inp.addEventListener("keydown", ev => { if (ev.key === "Enter") ui.querySelector('[data-act="speak"]').click(); });
}
function openVault() {
  mode = "vault"; keys.clear(); mouse.down = false;
  if (S.cosmic) { show(`<h2>🔒 Vault</h2><p class="muted">The vault is open. You are already a Cosmic Being.</p><button class="big" data-act="resume">Close</button>`); return; }
  show(`<h2>🔒 Vault</h2><p class="muted">Enter the code to open the vault.</p><input id="vcode" maxlength="12" placeholder="?????" style="text-transform:uppercase;letter-spacing:6px"><p id="vmsg" class="muted"></p><button class="big" data-act="vspeak">Open</button> ${S.note ? `<button data-act="note">📜 Read the note</button>` : ""} <button data-act="resume">Close</button>`);
  const inp = document.getElementById("vcode"); if (inp) inp.addEventListener("keydown", ev => { if (ev.key === "Enter") ui.querySelector('[data-act="vspeak"]').click(); });
}
function speakCode(fromVault) {
  const v = (document.getElementById(fromVault ? "vcode" : "code").value || "").trim().toUpperCase();
  if (v !== "NOMAD") { document.getElementById(fromVault ? "vmsg" : "cmsg").textContent = fromVault ? "The vault stays sealed." : "The stars do not answer."; return; }
  S.cosmic = true; S.bind = defaultBinds(); S.pts += 3; S.el = "cosmic"; save(); syncTouch(); shake = 1; flash = .6; puff(P.x, P.y, 80, "#ff5ad8", 600);
  show(`<h1 style="color:#ff5ad8;font-size:36px">COSMIC AWAKENED</h1><p>${S.dname} becomes a <b>Cosmic Being</b>.</p><div style="text-align:left" class="muted">✦ <b>Know any move</b> — every power and every element's skills are yours, with no level or trial needed.<br>✦ <b>Choose your 10</b> — open the Dragon Den (K) → Cosmic loadout to pick any 10 moves and rebind their keys.<br>✦ <b>The hardest element, Cosmic</b> — Star Beam breath, Cosmic Destruction, Cosmic Protection, Whirlpool, and the extra moves Black Hole, Supernova, Starfall, Gravity Crush, Time Warp and Astral Dash.<br>✦ A new world opens at the World Gate: the Starfall Expanse.<br>✦ +3 mastery points.</div><button class="big" data-act="resume">Embrace the stars</button>`);
}
function openTravel() {
  mode = "travel"; keys.clear(); mouse.down = false;
  show(`<h2>🌍 World Gate</h2><p class="muted">Travel to any world you have unlocked.</p><div class="ups">${Object.keys(WORLDS).map(Number).map(id => { const w = WORLDS[id], ok = worldUnlocked(id), here = WD.id === id, seen = S.visited[id]; return `<button class="up" data-act="goto" data-id="${id}" ${!ok || here ? "disabled style='opacity:.5'" : ""}><b>${w.name}</b>${here ? "You are here" : !ok ? LOCKTXT[id] : seen ? "Visited" : "<span style='color:#ffe27a'>New!</span>"}</button>`; }).join("")}</div><p><button data-act="resume">Cancel</button></p>`);
}
function travel(id) {
  if (!worldUnlocked(id)) return; loadWorld(id); P.x = WD.spawn.x; P.y = WD.spawn.y; P.inv = 2; setupWorld(); mode = "play"; ui.classList.remove("on"); keys.clear(); say("Entered " + WD.name, 3); save();
}
function openLoadout() {
  mode = "loadout"; keys.clear(); mouse.down = false; rebindSlot = null; renderLoadout();
}
function renderLoadout(msg0) {
  const opts = moveList();
  show(`<h2>✦ Cosmic Loadout</h2><p class="muted">Pick any 10 moves and bind each to a key. Click a key button, then press the new key (Esc cancels).${msg0 ? `<br><b style="color:#ffe27a">${msg0}</b>` : ""}</p>
  <div style="text-align:left">${S.bind.map((b, i) => `<div style="margin:5px 0"><span class="muted">Slot ${i + 1}</span> <button data-act="rebind" data-id="${i}" style="min-width:90px;${rebindSlot === i ? "background:#c03aa0" : ""}">${rebindSlot === i ? "press a key…" : keyName(b.key)}</button> <select data-slot="${i}" style="font:inherit;padding:6px;border-radius:6px;background:#0e1630;color:#fff;border:1px solid #3a5aa8;max-width:340px">${opts.map(o => `<option value="${o}" ${o === b.move ? "selected" : ""}>${moveName(o)}</option>`).join("")}</select></div>`).join("")}</div>
  <p class="muted">Reserved: W A S D, arrows, P, K, Tab, 1–8, Esc. Breath stays on mouse click.</p><button data-act="resetbinds">Reset to defaults</button> <button class="big" data-act="resume">Done</button>`);
}
function captureKey(k) {
  const i = rebindSlot; if (k === "escape") { rebindSlot = null; renderLoadout(); return; }
  if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", "p", "k", "tab"].includes(k) || /^[0-9]$/.test(k) || k.length > 1 && k !== "shift") { renderLoadout("That key is reserved."); return; }
  const other = S.bind.findIndex((b, j) => j !== i && b.key === k); if (other >= 0) S.bind[other].key = S.bind[i].key;
  S.bind[i].key = k; rebindSlot = null; save(); renderLoadout();
}
ui.addEventListener("change", e => { const t = e.target; if (t.dataset && t.dataset.slot !== undefined && S.bind) { S.bind[+t.dataset.slot].move = t.value; save(); } });
ui.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  switch (t.dataset.act) {
    case "cont": S = load(); startGame(); break;
    case "new": showHatch(); break;
    case "el": pickEl(t.dataset.id); break;
    case "hatch": S = defaultSave(); S.has = true; S.el = S.start = window._el || "fire"; S.dname = (document.getElementById("dn").value.trim() || "Ember").slice(0, 14); save(); startGame(); break;
    case "resume": resumeGame(); break;
    case "den": openDen(); break;
    case "setel": S.el = t.dataset.id; save(); openDen(); break;
    case "rank": { const id = t.dataset.id; if (S.pts > 0 && rank(id) < rankMax()) { S.pts--; S.rank[id] = rank(id) + 1; save(); } openDen(); break; }
    case "title": save(); showTitle(); break;
    case "note": openNote(); break;
    case "speak": speakCode(false); break;
    case "vspeak": speakCode(true); break;
    case "vault": openVault(); break;
    case "travel": openTravel(); break;
    case "goto": travel(+t.dataset.id); break;
    case "loadout": openLoadout(); break;
    case "rebind": rebindSlot = +t.dataset.id; renderLoadout(); break;
    case "resetbinds": S.bind = defaultBinds(); save(); renderLoadout(); break;
  }
});
let last = 0;
function loop(now) { const dt = Math.min(.033, (now - last) / 1000 || 0); last = now; if (S) update(dt); draw(); requestAnimationFrame(loop); }
document.addEventListener("visibilitychange", () => { if (document.hidden && mode === "play") pauseGame(); });
showTitle(); requestAnimationFrame(loop);

</script>
