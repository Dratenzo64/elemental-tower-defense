<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Creature Champs</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b1020; color: #e8ecff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
  #app { max-width: 980px; margin: 0 auto; padding: 14px; }
  h1 { font-size: 26px; letter-spacing: 2px; }
  h2 { font-size: 18px; margin-bottom: 8px; }
  .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .pill { background: #1a2347; border: 1px solid #2c3a73; border-radius: 999px; padding: 5px 12px; font-size: 14px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .tab, .btn { background: #1d2a5c; border: 1px solid #3a4c9a; border-radius: 10px; padding: 8px 14px; }
  .tab.on { background: #3a56d6; }
  .btn:hover:not(:disabled), .tab:hover { filter: brightness(1.2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.big { font-size: 18px; padding: 12px 22px; background: #2f7a3e; border-color: #4bc060; }
  .btn.red { background: #7a2f3a; border-color: #c04b5e; }
  .card { background: #131b3a; border: 1px solid #27346b; border-radius: 12px; padding: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .cr { cursor: pointer; position: relative; }
  .cr.sel { outline: 3px solid #ffd54a; }
  .cr .em { font-size: 44px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #111; margin-right: 4px; }
  .mv { font-size: 13px; color: #cfd6ff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .muted { color: #8f9bd0; font-size: 13px; }
  /* battle */
  .arena { background: linear-gradient(#1b2a63, #0f1738); border: 2px solid #3a4c9a; border-radius: 14px; padding: 14px; }
  .side { display: flex; align-items: center; gap: 14px; margin: 10px 0; }
  .side.foe { flex-direction: row-reverse; }
  .side .big { font-size: 72px; }
  .info { flex: 1; background: #0c1330cc; border-radius: 10px; padding: 8px 12px; }
  .bar { height: 14px; background: #301820; border-radius: 8px; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #4ee06a, #b6f05a); transition: width .4s; }
  .log { background: #0a0f24; border-radius: 10px; padding: 10px; height: 110px; overflow-y: auto; font-size: 14px; line-height: 1.5; margin: 10px 0; }
  .moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .move { text-align: left; padding: 10px 12px; border-radius: 10px; border: 2px solid; background: #101a42; font-weight: 600; }
  .move small { display: block; font-weight: 400; color: #b8c2f5; }
  .pic { position: relative; display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
  .pic .fx { position: absolute; pointer-events: none; animation: fl 1.4s ease-in-out infinite; text-shadow: 0 0 6px #fff8; }
  @keyframes fl { 0%,100% { transform: translateY(0) scale(1); opacity: .85; } 50% { transform: translateY(-6px) scale(1.25); opacity: 1; } }
  .pic .body { display: inline-block; transform: scaleX(var(--f, 1)) rotate(var(--t, 0deg)); }
  .pic .body.bob { animation: bob 1.6s ease-in-out infinite; }
  .pic .body.sway { animation: sway 2.2s ease-in-out infinite; }
  .pic .body.hover { animation: hov 2.8s ease-in-out infinite; }
  .pic .body.pulse { animation: pls 1.8s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: scaleX(var(--f)) rotate(var(--t)) translateY(0); } 50% { transform: scaleX(var(--f)) rotate(var(--t)) translateY(-5%); } }
  @keyframes sway { 0%,100% { transform: scaleX(var(--f)) rotate(calc(var(--t) - 5deg)); } 50% { transform: scaleX(var(--f)) rotate(calc(var(--t) + 5deg)); } }
  @keyframes hov { 0%,100% { transform: scaleX(var(--f)) rotate(var(--t)) translateY(-3%); } 50% { transform: scaleX(var(--f)) rotate(var(--t)) translateY(4%); } }
  @keyframes pls { 0%,100% { transform: scaleX(var(--f)) rotate(var(--t)) scale(1); } 50% { transform: scaleX(var(--f)) rotate(var(--t)) scale(1.1); } }
  .pic .cw { position: absolute; top: -14%; left: 50%; transform: translateX(-50%); }
  .pic .fz { position: absolute; right: -2%; bottom: -2%; background: #ffd54a; color: #111; font-weight: 800; border-radius: 6px; padding: 0 4px; }
  .side .pic { flex-shrink: 0; }
  #toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #000d; border: 1px solid #6fd8ff; padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9; }
  #toast.show { opacity: 1; }
  .center { text-align: center; }
  select { font: inherit; background: #1d2a5c; color: #fff; border: 1px solid #3a4c9a; border-radius: 8px; padding: 6px; }
</style>
</head>

// per-animal look: size from its HP, which way it faces, how it idles

function look(species, key) {
  const sp = SPECIES[species];
  let hsh = 0; for (const ch of (key || species)) hsh = (hsh * 31 + ch.charCodeAt(0)) >>> 0;
  return {
    scale: Math.max(.82, Math.min(1.28, .55 + sp.hp / 215)),
    flip: hsh % 2 ? -1 : 1,
    tilt: ((hsh >> 3) % 9) - 4,
    idle: IDLE[(hsh >> 5) % IDLE.length],
    tx: (hsh >> 8) % 3, // which corner effects cluster toward
  };
}

let toastTimer = null;
function toast(t) {
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}
function save(msg) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ S, nextId }));
    if (msg) toast(msg);
  } catch (e) {}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.S || !Array.isArray(d.S.creatures)) return false;
    S = d.S; nextId = d.nextId || 1000;
    return true;
  } catch (e) { return false; }
}

// some creatures can learn moves from elements that aren't their own ("off-type" moves)
function extraEls(c) {
  if (!c.xel) {
    c.xel = [];
    const r = Math.random(), others = EL_IDS.filter(e => e !== c.el && e !== c.el2);
    const n = r < 0.45 ? 0 : r < 0.85 ? 1 : 2;
    while (c.xel.length < n) { const e = pick(others); if (!c.xel.includes(e)) c.xel.push(e); }
  }
  return c.xel;
}
function movePool(el, el2, extra) {
  const out = [];
  for (const e of [el, el2, ...(extra || [])]) if (e) for (const m of MOVES[e]) out.push({ n: m[0], d: m[1], a: m[2], el: e });
  for (const m of MOVES.normal) out.push({ n: m[0], d: m[1], a: m[2], el: "normal" });
  return out;
}
// give a creature a second element (dual typing): it learns that element's mid-tier move,
// replacing its weakest move, and can train that element's other moves too
function giveSecond(c, el2, tier = 1) {
  c.el2 = el2; c.el2t = tier;
  if (c.moves.some(m => m.el === el2)) return;
  const mid = { n: MOVES[el2][1][0], d: MOVES[el2][1][1], a: MOVES[el2][1][2], el: el2 };
  let w = 0; c.moves.forEach((m, i) => { if (m.d * m.a < c.moves[w].d * c.moves[w].a) w = i; });
  c.moves[w] = mid;
}
function mv(m) { return `${m.n} ${m.d} D ${m.a} A`; }

function newCreature(species, el, tier = 1, fuse = 0, lead = null) {
  const pool = movePool(el);
  const shuffled = pool.slice().sort(() => Math.random() - 0.5);
  // a `lead` move is forced into the set (used so starters never share a move set)
  if (lead) shuffled.splice(0, 0, ...shuffled.splice(shuffled.findIndex(m => m.n === lead.n), 1));
  const moves = shuffled.slice(0, 4).map(m => ({ ...m }));
  // always give at least one dependable move
  if (!moves.some(m => m.a >= 95)) moves[0] = { ...pool[0] };
  const nc = { id: uid(), species, el, tier, fuse, moves };
  extraEls(nc);
  return nc;
}
function weightedSpecies(w, el) {
  // species whose "home" is this element are far more likely to show up with it
  const bag = [];
  for (const s of SP_IDS) {
    const n = (w[SPECIES[s].tier] || 0) * (el && SPECIES[s].home === el ? 5 : 1);
    for (let i = 0; i < n; i++) bag.push(s);
  }
  return pick(bag);
}

// a hybrid (species2) blends both animals' stats, plus a small bonus for being a chimera
function base(c) {
  const a = SPECIES[c.species];
  if (!c.species2) return a;
  const b = SPECIES[c.species2];
  const m = (x, y) => Math.round((x + y) / 2 * 1.1);
  return { hp: m(a.hp, b.hp), atk: m(a.atk, b.atk), spd: m(a.spd, b.spd), e: a.e, tier: Math.max(a.tier, b.tier) };
}
function stats(c, scale = 1, isPlayer = true) {
  const sp = base(c);
  const f = 1 + 0.25 * c.fuse;
  const t = 1 + 0.15 * (c.tier - 1);
  const pres = isPlayer ? 1 + 0.05 * (S.prestige || 0) : 1;
  return {
    maxHp: Math.round(sp.hp * 3.5 * f * scale),
    atk: (sp.atk / 100) * f * t * pres * Math.pow(scale, 0.85),
    spd: sp.spd,
  };
}

function typeMult(atkEl, def) {
  // defender may be dual-typed — each of its types multiplies the result
  const types = typeof def === "string" ? [def] : [def.el, def.el2].filter(Boolean);
  let m = 1;
  for (const d of types) {
    if (ELEMENTS[atkEl].beats.includes(d)) m *= 2;
    else if (ELEMENTS[d].beats.includes(atkEl)) m *= 0.5;
  }
  return m;
}

function tags(c) { return tag(c.el) + (c.el2 ? tag(c.el2) : ""); }
function tag(el) { return `<span class="tag" style="background:${ELEMENTS[el].color}">${ELEMENTS[el].icon} ${el}</span>`; }

// ============================================================
// NEW GAME
// ============================================================
function startGame(el) {
    // five DIFFERENT starters: a beginner dragon plus four different animals of your
  // element, each built around its own lead move so no two share a move set
  const pool = movePool(el);
  const leads = pool.slice().sort(() => Math.random() - 0.5).slice(0, 5);
  const natives = SP_IDS.filter(s => SPECIES[s].home === el && SPECIES[s].tier <= 2).sort(() => Math.random() - 0.5).slice(0, 4);
  const cs = ["Whelp", ...natives].map((sp, i) => newCreature(sp, el, 1, 0, leads[i]));
  S = { coins: 150, rank: RANK_START, prestige: 0, creatures: cs, elements: [], eggs: [], team: cs.map(c => c.id), wins: 0 };
  save("Game started!");
  render();
}

function prestigeReset() {
  S.prestige++;
  S.coins = 150;
  S.rank = startRank(); // more creatures kept = higher starting rank
  for (let i = 0; i < S.prestige; i++) S.eggs.push({ id: uid(), kind: "basic", el: null }); // restart #n gives n eggs
  S.wins = 0;
  // creatures, elements, eggs are kept
  save("Restarted — +5% attack permanently!");
  battle = null;
  ui.tab = "battle";
  render();
}

// BATTLE
// ============================================================
function makeFoe(rank) {
  rank = tierOf(rank);
  const scale = 0.7 + (LADDER_TOP - rank) * 0.085;
  const n = TEAM_MAX; // every rival fields a full team of five
  const team = [];
  // five DIFFERENT primary elements, so you face a mixed team
  const els = EL_IDS.slice().sort(() => Math.random() - 0.5).slice(0, n);
  for (let i = 0; i < n; i++) {
    const tierW = rank <= 8 ? { 1: 15, 2: 45, 3: 40 } : rank <= 17 ? { 1: 40, 2: 45, 3: 15 } : { 1: 75, 2: 22, 3: 3 };
    const fel = els[i];
    const c = newCreature(weightedSpecies(tierW, fel), fel, 1 + (rank <= 8 ? 1 : 0), 0);
    if (rank <= 17 && Math.random() < (rank <= 8 ? 0.6 : 0.3)) giveSecond(c, pick(EL_IDS.filter(e => e !== fel)));
    if (rank <= 17 && Math.random() < (rank <= 8 ? 0.5 : 0.25)) c.species2 = pick(SP_IDS.filter(s => s !== c.species));
    team.push(c);
  }
  return {
    name: pick(NAMES) + (1 + rnd(999)),
    scale,
    team: team.map(c => ({ c, st: stats(c, scale, false), hp: stats(c, scale, false).maxHp })),
  };
}

function startBattle() {
  if (!S.team.length) { toast("Pick at least one creature for your team"); return; }
  const mine = S.team.map(id => S.creatures.find(c => c.id === id)).filter(Boolean).slice(0, TEAM_MAX);
  const foe = makeFoe(S.rank);
  battle = {
    foeName: foe.name,
    me: mine.map(c => { const st = stats(c); return { c, st, hp: st.maxHp }; }),
    foe: foe.team,
    mi: 0, fi: 0, log: [], over: false, won: false, busy: false, switching: false,
    isChamp: S.rank === 1,
  };
  battle.log.push(`${battle.foeName} (Rank #${S.rank}) wants to battle!`);
  battle.log.push(`${nm(battle.foe[0].c)} appears!`);
  ui.tab = "battle-live";
  render();
}

function hit(att, def, m, isPlayer) {
  const name = `${isPlayer ? "" : "Foe "}${nm(att.c)}`;
  if (Math.random() * 100 >= m.a) { battle.log.push(`${name} used ${m.n} — missed!`); return; }
  const tm = typeMult(m.el, def.c);
  const el2b = m.el === att.c.el2 ? 1 + 0.15 * ((att.c.el2t || 1) - 1) : 1;
  const dmg = Math.max(1, Math.round(m.d * att.st.atk * el2b * tm * (0.9 + Math.random() * 0.2)));
  def.hp = Math.max(0, def.hp - dmg);
  let note = tm > 1 ? " Super effective!" : tm < 1 ? " Not very effective..." : "";
  battle.log.push(`${name} used ${m.n} for ${dmg}!${note}`);
}

function foeChoose(f, me) {
  if (Math.random() < 0.2) return pick(f.c.moves);
  let best = f.c.moves[0], bv = -1;
  for (const m of f.c.moves) {
    const v = m.d * (m.a / 100) * typeMult(m.el, me.c);
    if (v > bv) { bv = v; best = m; }
  }
  return best;
}

function checkFaints() {
  const me = battle.me[battle.mi], foe = battle.foe[battle.fi];
  if (foe.hp <= 0) {
    battle.log.push(`Foe ${nm(foe.c)} fainted!`);
    if (battle.fi + 1 < battle.foe.length) {
      battle.fi++;
      battle.log.push(`${battle.foeName} sends out ${nm(battle.foe[battle.fi].c)}!`);
    } else { endBattle(true); return true; }
  }
  if (me.hp <= 0) {
    battle.log.push(`${nm(me.c)} fainted!`);
    const next = battle.me.findIndex(x => x.hp > 0);
    if (next < 0) { endBattle(false); return true; }
    battle.mi = next;
    battle.log.push(`Go, ${nm(battle.me[next].c)}!`);
  }
  return false;
}

function endBattle(won) {
  battle.over = true; battle.won = won;
  if (won) {
    const reward = Math.round((30 + 12 * (LADDER_TOP - tierOf(S.rank))) * 1.25);
    S.coins += reward;
    S.wins++;
    battle.reward = reward;
    battle.log.push(`You beat ${battle.foeName}! +${reward} coins.`);
    if (S.rank > 1) { const left = battle.me.filter(x => x.hp > 0).length, gain = 20 + 20 * left; S.rank = Math.max(1, S.rank - gain); battle.log.push(`Rank up +${gain} (${left} creature${left === 1 ? "" : "s"} left)! You are now #${S.rank}.`); }
    else battle.champion = true;
  } else {
    battle.log.push(`You lost to ${battle.foeName}. Train up and try again!`);
  }
  save();
}

function doTurn(moveIdx, switchTo) {
  if (battle.over || battle.busy) return;
  const me = battle.me[battle.mi];
  let foe = battle.foe[battle.fi];
  if (switchTo != null) {
    if (battle.me[switchTo].hp <= 0 || switchTo === battle.mi) return;
    battle.mi = switchTo;
    battle.log.push(`Go, ${nm(battle.me[switchTo].c)}!`);
    const fm = foeChoose(foe, battle.me[battle.mi]);
    hit(foe, battle.me[battle.mi], fm, false);
    checkFaints();
    render(); return;
  }
  const pm = me.c.moves[moveIdx];
  const fm = foeChoose(foe, me);
  const meFirst = me.st.spd > foe.st.spd || (me.st.spd === foe.st.spd && Math.random() < 0.5);
  const order = meFirst ? ["me", "foe"] : ["foe", "me"];
  for (const who of order) {
    const a = battle.me[battle.mi], d = battle.foe[battle.fi];
    if (who === "me") { if (a.hp > 0 && d.hp > 0) hit(a, d, pm, true); }
    else { if (d.hp > 0 && a.hp > 0) hit(d, a, fm, false); }
    if (battle.foe[battle.fi].hp <= 0 || battle.me[battle.mi].hp <= 0) break;
  }
  checkFaints();
  render();
}

      <div class="grid">${crs}</div>
      <div class="row"><button class="btn" data-act="fuseCr" ${ui.selCr && ui.selB ? "" : "disabled"}>${(() => { const fa = findCr(ui.selCr), fb = findCr(ui.selB); return fa && fb ? `Fuse +${fa.fuse} with +${fb.fuse} → +${Math.max(Math.max(fa.fuse, fb.fuse) + 1, fa.fuse + fb.fuse)}${fa.species !== fb.species && !fa.species2 ? " (hybrid!)" : ""}` : "Fuse the two selected"; })()}</button></div>
      <h2 style="margin-top:14px">Fuse elements</h2><p class="muted">Pick two of the same element and tier to make a higher tier (+15% damage per tier).</p>
      <div class="grid">${els || '<span class="muted">No elements</span>'}</div>
      <div class="row"><button class="btn" data-act="fuseEl" ${ui.selEl && ui.selEl2 ? "" : "disabled"}>Fuse the two selected</button></div>`;
  } else if (ui.tab === "train") {
    const c = S.creatures.find(x => x.id === ui.selCr);
    body = `<p class="muted" style="margin-bottom:8px">Pick a creature, then a move slot, then a replacement move (${TRAIN_PRICE}🪙).</p>
      <div class="grid">${S.creatures.map(x => crCard(x, { act: "selCr", sel: ui.selCr === x.id })).join("")}</div>`;
    if (c) {
      body += `<h2 style="margin-top:14px">${nm(c)}'s moves</h2><div class="row">${c.moves.map((m, i) => `<button class="btn ${ui.trainSlot === i ? "tab on" : ""}" data-act="slot" data-i="${i}">${i + 1}: ${mv(m)}</button>`).join("")}</div>`;
      if (ui.trainSlot != null) {
        const pool = movePool(c.el, c.el2, extraEls(c)).filter(m => !c.moves.some(x => x.n === m.n));
        body += `<p class="muted">${nm(c)} can learn moves of: ${[c.el, c.el2, ...extraEls(c)].filter(Boolean).join(", ")}, normal</p><div class="row">${pool.map((m, i) => `<button class="btn" data-act="learn" data-n="${m.n}" ${S.coins < TRAIN_PRICE ? "disabled" : ""} style="border-color:${ELEMENTS[m.el].color}">${mv(m)}</button>`).join("")}</div>`;
      }
    }
  }
  app.innerHTML = `<div class="top"><h1>⚔️ CREATURE CHAMPS</h1>
    <div><span class="pill">🪙 ${S.coins}</span> <span class="pill">Rank #${S.rank}</span> <span class="pill">Wins ${S.wins}</span> <span class="pill">+${S.prestige * 5}% atk</span></div></div>
    <div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${ui.tab === k ? "on" : ""}" data-act="tab" data-k="${k}">${l}</button>`).join("")}</div>${body}`;
}

function render() {
  if (!S) return renderStart();
  if (ui.tab === "battle-live" && battle) return renderBattle();
  renderHub();
}

// ============================================================
// ACTIONS
// ============================================================
function findCr(id) { return S.creatures.find(c => c.id === +id); }

app.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act, id = +t.dataset.id;
  switch (act) {
    case "start": startGame(t.dataset.el); return;
    case "tab": ui.tab = t.dataset.k; ui.selCr = ui.selB = ui.selEl = ui.selEl2 = ui.selEgg = null; ui.trainSlot = null; break;
    case "battle": startBattle(); return;
    case "move": doTurn(+t.dataset.i); return;
    case "switch": doTurn(null, +t.dataset.i); return;
    case "leave": battle = null; ui.tab = "battle"; break;
    case "prestige": prestigeReset(); return;
    case "tmAdd": if (S.team.length < TEAM_MAX) { S.team.push(id); save("Added to team"); } else toast("Team is full — remove someone first"); break;
    case "tmX": if (S.team.length > 1) { S.team = S.team.filter(x => x !== id); save("Moved to bench"); } break;
    case "tmL": case "tmR": {
      const i = S.team.indexOf(id), j = act === "tmL" ? i - 1 : i + 1;
      if (i >= 0 && j >= 0 && j < S.team.length) { [S.team[i], S.team[j]] = [S.team[j], S.team[i]]; save(); }
      break;
    }
    case "toggleTeam": {
      const i = S.team.indexOf(id);
      if (i >= 0) { if (S.team.length > 1) S.team.splice(i, 1); else toast("Keep at least one creature"); }
      else if (S.team.length < TEAM_MAX) S.team.push(id); else toast("Team is full (5)");
      save(); break;
    }
    case "buyEgg": { const e = EGGS[t.dataset.k]; if (S.coins >= e.price) { S.coins -= e.price; S.eggs.push({ id: uid(), kind: t.dataset.k, el: null }); save("Egg bought"); } break; }
    case "buyEl": if (S.coins >= ELEMENT_PRICE) { S.coins -= ELEMENT_PRICE; S.elements.push({ id: uid(), el: t.dataset.k, tier: 1 }); save("Element bought"); } break;
    case "selEgg": ui.selEgg = id; break;
    case "selEl": ui.selEl = id; break;
    case "applyEl": {
      const egg = S.eggs.find(e => e.id === ui.selEgg), el = S.elements.find(e => e.id === ui.selEl);
      if (egg && el) {
        if (egg.el) S.elements.push({ id: uid(), ...egg.el }); // swap the old one back
        egg.el = { el: el.el, tier: el.tier };
        S.elements = S.elements.filter(e => e.id !== el.id);
        ui.selEl = null; save("Element applied to egg");
      }
      break;
    }
    case "hatch": {
      ev.stopPropagation();
      const i = S.eggs.findIndex(e => e.id === id);
      if (i < 0) break;
      const egg = S.eggs[i];
      const el = egg.el ? egg.el.el : pick(EL_IDS);
      const sp = weightedSpecies(EGGS[egg.kind].w, el);
      const c = newCreature(sp, el, egg.el ? egg.el.tier : 1);
      if (egg.el2 && egg.el2 !== el) giveSecond(c, egg.el2, egg.el2t || 1);
      S.creatures.push(c); S.eggs.splice(i, 1);
      save(`Hatched a ${nm(c)}!`);
      break;
    }
    case "selCr":
      if (ui.tab === "fuse") {
        if (ui.selCr === id) ui.selCr = null; else if (ui.selB === id) ui.selB = null;
        else if (!ui.selCr) ui.selCr = id; else ui.selB = id;
      } else { ui.selCr = id; ui.trainSlot = null; }
      break;
    case "selElF":
      if (ui.selEl === id) ui.selEl = null; else if (ui.selEl2 === id) ui.selEl2 = null;
      else if (!ui.selEl) ui.selEl = id; else ui.selEl2 = id;
      break;
    case "fuseCr": {
      const a = findCr(ui.selCr), b = findCr(ui.selB);
      if (a && b && a.id !== b.id) {
        a.fuse = Math.max(a.fuse, b.fuse) + 1 > a.fuse + b.fuse ? Math.max(a.fuse, b.fuse) + 1 : a.fuse + b.fuse;
        a.tier = Math.max(a.tier, b.tier);
        // different animals blend into a hybrid (dragon + horse = a dragon on horse legs)
        if (b.species !== a.species && !a.species2) a.species2 = b.species;
        if (b.el !== a.el && !a.el2) giveSecond(a, b.el, b.tier);
        S.creatures = S.creatures.filter(c => c.id !== b.id);
        S.team = S.team.filter(x => x !== b.id);
        if (!S.team.includes(a.id) && S.team.length < TEAM_MAX) S.team.push(a.id);
        ui.selCr = ui.selB = null;
        save(`${nm(a)} fused to +${a.fuse}!`);
      }
      break;
    }
    case "fuseEl": {
      const a = S.elements.find(e => e.id === ui.selEl), b = S.elements.find(e => e.id === ui.selEl2);
      if (a && b && a.id !== b.id) {
        if (a.el !== b.el || a.tier !== b.tier) { toast("Need the same element and tier"); break; }
        if (a.tier >= MAX_TIER) { toast("Already max tier"); break; }
        a.tier++;
        S.elements = S.elements.filter(e => e.id !== b.id);
        ui.selEl = ui.selEl2 = null;
        save(`${a.el} is now tier ${a.tier}!`);
      }
      break;
    }
    case "combine": {
      const egg = S.eggs.find(e => e.id === ui.selEgg), el = S.elements.find(e => e.id === ui.selEl);
      if (egg && el && !(egg.el && egg.el.el === el.el) && egg.el2 !== el.el) {
        egg.el2 = el.el; egg.el2t = el.tier;
        S.elements = S.elements.filter(e => e.id !== el.id);
        ui.selEl = null;
        save(`Egg is now + ${egg.el2}!`);
      }
      break;
    }
    case "slot": ui.trainSlot = +t.dataset.i; break;
    case "learn": {
      const c = findCr(ui.selCr);
      if (c && ui.trainSlot != null && S.coins >= TRAIN_PRICE) {
        const m = movePool(c.el, c.el2, extraEls(c)).find(x => x.n === t.dataset.n);
        if (m) { c.moves[ui.trainSlot] = { ...m }; S.coins -= TRAIN_PRICE; ui.trainSlot = null; save(`Learned ${m.n}!`); }
      }
      break;
    }
  }
  render();
});

if (load()) { /* resume */ }
render();
})();
</script>
</body>
</html>
