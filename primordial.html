  .wgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
  h2.sec { margin: 14px 0 0; text-align: left; letter-spacing: 2px; font-size: 18px; color: #bfe8ff; }
  .wcard { background: #0d1a22; border: 2px solid; border-radius: 12px; padding: 12px; text-align: left; color: #e8f4ff; margin: 0; line-height: 1.5; }
  .wcard.done { background: #10241f; }
  .wcard:disabled { opacity: .6; }
  #rotate { position: fixed; inset: 0; background: #05080c; z-index: 99; display: none; align-items: center; justify-content: center; text-align: center; font-size: 20px; padding: 30px; }

  body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; touch-action: none; }
  @media (pointer: coarse) { #dashBtn { width: 80px; height: 80px; font-size: 15px; } #pauseBtn { padding: 10px 14px; font-size: 16px; } .panel { padding: 14px 16px; } button { min-height: 44px; } }
  #pauseBtn { position: absolute; right: 12px; top: 44px; display: none; z-index: 2; background: #101c24cc; border: 1px solid #2b5a63; padding: 6px 12px; font-size: 14px; margin: 0; }
  body.play #pauseBtn { display: block; }
  #dashBtn { top: 96px !important; position: absolute; right: 12px; top: 60px; width: 64px; height: 64px; border-radius: 50%; opacity: .75; padding: 0; font-size: 13px; }
  #toast { position: absolute; top: 12px; right: 16px; background: #1fa862; padding: 6px 12px; border-radius: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 3; }

</style>
</head>

// ============================================================
// SAVE (same SAVE_KEY / JSON blob / try-catch pattern as the other games)
// ============================================================
const SAVE_KEY = "primordial-save-v1";
const freshS = () => ({ world: 0, stage: 0, xp: 0, kills: 0, started: false, done: false, unlocked: 1, cleared: [], prog: WORLDS.map(() => ({ stage: 0, xp: 0 })) });
let S = freshS();
const commit = () => { if (S.prog && S.prog[S.world]) S.prog[S.world] = { stage: S.stage, xp: S.xp }; }; // every world keeps its own evolution + xp
let toastTimer = null;
function toast() { const el = document.getElementById("toast"); el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1200); }
function save(show = true) { try { commit(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); if (show) toast(); } catch (e) {} }
function load() {
  try {
    const r = localStorage.getItem(SAVE_KEY);
    if (r) {
      const d = JSON.parse(r); S = Object.assign(S, d);
      if (d.prog) while (S.prog.length < WORLDS.length) S.prog.push({ stage: 0, xp: 0 });
      if (!d.prog) { // older save: one active world
        S.unlocked = Math.min(WORLDS.length, (d.world || 0) + 1); S.prog = WORLDS.map(() => ({ stage: 0, xp: 0 }));
        S.prog[S.world] = { stage: d.stage || 0, xp: d.xp || 0 }; S.cleared = [];
        for (let i = 0; i < (d.world || 0); i++) S.cleared.push(i);
      }
    }
  } catch (e) {}
}
function startWorld(w) {
  commit(); S.world = w; S.stage = S.prog[w].stage; S.xp = S.prog[w].xp; S.started = true;
  try { const el = document.documentElement; if (document.body.classList.contains("touch") && el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(() => {})).catch(() => {}); } catch (e) {}
  startGame();
}

function spawnFoe() {

function hurtP(d) {

}

}

let swing = null, pulses = [];

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  tm += dt;
  if (mode !== "play" && mode !== "won") return;
  if (mode === "won") { stepFx(dt); return; }
  // movement
  let dx = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0), dy = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
  if (joy.l && Math.hypot(joy.l.dx, joy.l.dy) > .1) { dx = joy.l.dx; dy = joy.l.dy; }
  const l = Math.hypot(dx, dy) || 1, k = Math.min(1, Math.hypot(dx, dy));
  const tvx = dx / l * k * st.spd, tvy = dy / l * k * st.spd;
  P.vx += (tvx - P.vx) * Math.min(1, dt * 9); P.vy += (tvy - P.vy) * Math.min(1, dt * 9);
  if (P.dash > 0) { P.dash -= dt; P.x += P.dvx * dt; P.y += P.dvy * dt; } else { P.x += P.vx * dt; P.y += P.vy * dt; }
  P.x = Math.max(st.r, Math.min(WW - st.r, P.x)); P.y = Math.max(st.r, Math.min(WH - st.r, P.y));
  cam.x = Math.max(0, Math.min(WW - W, P.x - W / 2)); cam.y = Math.max(0, Math.min(WH - H, P.y - H / 2));
  P.cd -= dt; P.inv -= dt; P.dashCd -= dt; P.hitF -= dt;
  // aim / fire
  let firing = false;
  if (joy.r && Math.hypot(joy.r.dx, joy.r.dy) > .2) { P.face = Math.atan2(joy.r.dy, joy.r.dx); firing = true; }
  else if (!joy.r && !document.body.classList.contains("touch") || mouse.down) { P.face = Math.atan2(mouse.y + cam.y - P.y, mouse.x + cam.x - P.x); firing = mouse.down; }
  if (firing && P.cd <= 0) attack();
  // spawn
  const cap = bossOn ? 5 : 12 + S.stage * 3;
  spawnT -= dt; if (spawnT <= 0 && foes.length < cap) { spawnFoe(); spawnT = .55; }
  // shots
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.mine) {
      for (const f of foes) if (dist(s, f) < f.r + s.r) { f.hp -= s.d; f.flash = .1; s.life = 0; break; }
      if (s.life > 0 && boss && dist(s, boss) < boss.r + s.r) { boss.hp -= s.d; boss.flash = .08; s.life = 0; }
    } else if (dist(s, P) < st.r + s.r) { hurtP(s.d); s.life = 0; }

    const a = Math.atan2(P.y - f.y, P.x - f.x), d = dist(f, P);
    if (f.type === "prey") { f.ang += Math.sin(f.t) * dt * 2; const fl = d < 220 ? a + Math.PI : f.ang; f.x += Math.cos(fl) * f.spd * dt; f.y += Math.sin(fl) * f.spd * dt; }
    else if (f.type === "hunter") { f.x += Math.cos(a) * f.spd * dt; f.y += Math.sin(a) * f.spd * dt; if (d < f.r + st.r) hurtP(f.dmg); }
    else if (f.lunge > 0) { f.lunge -= dt; f.x += f.lx * 360 * dt; f.y += f.ly * 360 * dt; if (d < f.r + st.r) hurtP(f.dmg); }
    else { const dir = d < 260 ? -1 : d > 380 ? 1 : 0; f.x += Math.cos(a) * f.spd * dir * dt; f.y += Math.sin(a) * f.spd * dir * dt;
      if (f.cd <= 0 && d < 520) { f.cd = 2.6; f.lunge = .5; f.lx = Math.cos(a); f.ly = Math.sin(a); } }
    f.x = Math.max(10, Math.min(WW - 10, f.x)); f.y = Math.max(10, Math.min(WH - 10, f.y));
  }
  for (const f of foes) if (f.hp <= 0) {
    S.kills++; gainXp(f.xp);
    for (let i = 0; i < 8; i++) fx.push({ x: f.x, y: f.y, vx: rnd(-160, 160), vy: rnd(-160, 160), life: .5, c: WD().foe });
    if (Math.random() < .3) orbs.push({ x: f.x, y: f.y });

}

  fx = fx.filter(p => p.life > 0);

  for (const q of pulses) {

  const c = f.flash > 0 ? "#fff" : WD().foe;
  ctx.fillStyle = c;
  if (f.type === "prey") { ctx.globalAlpha = .85; ctx.beginPath(); ctx.arc(0, 0, f.r, 0, 7); ctx.fill(); ctx.globalAlpha = 1; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-f.r * .3, -f.r * .2, f.r * .2, 0, 7); ctx.arc(f.r * .3, -f.r * .2, f.r * .2, 0, 7); ctx.fill(); }
  else if (f.type === "hunter") { ctx.beginPath(); for (let i = 0; i < 16; i++) { const a = i / 16 * 6.283 + t / 800, rr = i % 2 ? f.r * .7 : f.r * 1.2; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.fill(); ctx.fillStyle = "#300"; ctx.beginPath(); ctx.arc(0, 0, f.r * .35, 0, 7); ctx.fill(); }
  else { ctx.strokeStyle = c; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, f.r, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, f.r * .4, 0, 7); ctx.fill(); }
  ctx.restore();
  if (f.hp < f.max) { ctx.fillStyle = "#000"; ctx.fillRect(f.x - f.r, f.y - f.r - 9, f.r * 2, 4); ctx.fillStyle = "#e44"; ctx.fillRect(f.x - f.r, f.y - f.r - 9, f.r * 2 * f.hp / f.max, 4); }
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const wd = WD(), g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, wd.bg[0]); g.addColorStop(1, wd.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!P || (mode !== "play" && mode !== "won" && mode !== "pause")) return;
  const sx = shake > 0 ? rnd(-6, 6) * shake * 2 : 0, sy = shake > 0 ? rnd(-6, 6) * shake * 2 : 0;
  ctx.translate(-cam.x + sx, -cam.y + sy);
  // drifting background motes
  ctx.fillStyle = "rgba(255,255,255,.07)";
  for (let i = 0; i < 70; i++) { const bx = (i * 379 + tm * (8 + i % 7)) % WW, by = (i * 211 + Math.sin(tm * .4 + i) * 40) % WH; if (bx > cam.x - 20 && bx < cam.x + W + 20 && by > cam.y - 20 && by < cam.y + H + 20) { ctx.beginPath(); ctx.arc(bx, by, 3 + (i % 5) * 2, 0, 7); ctx.fill(); } }
  ctx.strokeStyle = wd.acc; ctx.globalAlpha = .4; ctx.lineWidth = 4; ctx.strokeRect(0, 0, WW, WH); ctx.globalAlpha = 1; ctx.lineWidth = 1;
  for (const o of orbs) { ctx.fillStyle = "#6bff8a"; ctx.shadowColor = "#6bff8a"; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(o.x, o.y, 8 + Math.sin(tm * 6) * 1.5, 0, 7); ctx.fill(); ctx.shadowBlur = 0; }
  for (const f of foes) drawFoe(f, tm * 1000);
  if (boss) {
    const b = boss;
    ctx.save(); ctx.translate(b.x, b.y); ctx.shadowColor = wd.boss.col; ctx.shadowBlur = 30;
    ctx.fillStyle = b.flash > 0 ? "#fff" : wd.boss.col; ctx.beginPath();
    for (let i = 0; i < 40; i++) { const a = i / 40 * 6.283, rr = b.r * (i % 2 ? .88 : 1.08) * (1 + .05 * Math.sin(tm * 3 + i)); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-b.r * .3, -b.r * .15, b.r * .17, 0, 7); ctx.arc(b.r * .3, -b.r * .15, b.r * .17, 0, 7); ctx.fill();
    ctx.fillStyle = b.state === "wind" ? "#f00" : "#000"; ctx.beginPath(); ctx.arc(-b.r * .27, -b.r * .15, b.r * .08, 0, 7); ctx.arc(b.r * .33, -b.r * .15, b.r * .08, 0, 7); ctx.fill();
    ctx.restore();
  }
  for (const q of pulses) { ctx.globalAlpha = Math.max(0, 1 - q.r / q.max) * .8; ctx.strokeStyle = WD().boss.col; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.stroke(); } ctx.globalAlpha = 1; ctx.lineWidth = 1;
  if (swing && P) { ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.arc(P.x, P.y, swing.reach, swing.ang - swing.arc / 2, swing.ang + swing.arc / 2); ctx.fill(); }
  for (const s of shots) { ctx.fillStyle = s.mine ? wd.acc : "#ff5d5d"; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
  ctx.shadowBlur = 0;
  if (mode === "play") {
    ctx.globalAlpha = P.inv > 0 && Math.floor(P.inv * 20) % 2 ? .4 : 1;
    drawBeing(P.x, P.y, st.r, P.face, S.world, S.stage, wd.c[S.stage].col, tm * 1000, P.hitF > 0);
    ctx.globalAlpha = 1;
  }
  for (const p of fx) { ctx.globalAlpha = Math.max(0, p.life * 1.5); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 5, 5); }
  ctx.globalAlpha = 1; ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * .6})`; ctx.fillRect(0, 0, W, H); }
  hud();
}
function hud() {
  const wd = WD(), need = NEED[S.stage] * (1 + .12 * S.world);
  ctx.textAlign = "left"; ctx.font = "bold 18px system-ui"; ctx.fillStyle = "#fff";
  ctx.fillText(`${wd.name} · ${wd.forms[S.stage]} · ${st.atk.n}`, 16, 26);
  ctx.fillStyle = "#222"; ctx.fillRect(16, 36, 260, 14); ctx.fillStyle = "#e44"; ctx.fillRect(16, 36, 260 * Math.max(0, P.hp / st.hp), 14);
  ctx.fillStyle = "#222"; ctx.fillRect(16, 56, 260, 10); ctx.fillStyle = bossOn ? "#888" : wd.acc; ctx.fillRect(16, 56, 260 * Math.min(1, S.xp / need), 10);
  ctx.font = "12px system-ui"; ctx.fillStyle = "#cfe8ff";
  ctx.fillText(S.stage < LAST ? `XP → ${wd.forms[S.stage + 1]}` : (bossOn ? "BOSS FIGHT" : "XP → BOSS"), 16, 82);
  let cx = 16; ctx.textAlign = "left"; ctx.font = "bold 11px system-ui";
  wd.forms.forEach((n, i) => { ctx.fillStyle = i === S.stage ? wd.acc : i < S.stage ? "#7a9aa8" : "#4a5a66"; const t2 = (i ? " › " : "") + n; ctx.fillText(t2, cx, 100); cx += ctx.measureText(t2).width; });
  ctx.textAlign = "right"; ctx.font = "12px system-ui"; ctx.fillStyle = "#cfe8ff"; ctx.fillText(`kills ${S.kills} · dash ${P.dashCd > 0 ? Math.ceil(P.dashCd * 10) / 10 + "s" : "ready"}`, W - 16, 24);
  if (boss) {
    const bw = 520, bx = W / 2 - bw / 2;
    ctx.textAlign = "center"; ctx.font = "bold 18px system-ui"; ctx.fillStyle = "#fff"; ctx.fillText(wd.boss.name, W / 2, 28);
    ctx.fillStyle = "#222"; ctx.fillRect(bx, 36, bw, 14); ctx.fillStyle = wd.boss.col; ctx.fillRect(bx, 36, bw * Math.max(0, boss.hp / boss.max), 14);
  }
  if (msgT > 0) { ctx.textAlign = "center"; ctx.font = "bold 30px system-ui"; ctx.fillStyle = "#fff"; ctx.globalAlpha = Math.min(1, msgT); ctx.fillText(msg, W / 2, 130); ctx.globalAlpha = 1; }
  if (factT > 0) { ctx.textAlign = "center"; ctx.font = "15px system-ui"; ctx.fillStyle = "#cfe8ff"; ctx.globalAlpha = Math.min(1, factT); ctx.fillText(fact, W / 2, 162); ctx.globalAlpha = 1; }
  ctx.textAlign = "center"; ctx.font = "13px system-ui"; ctx.fillStyle = "rgba(255,255,255,.45)";
  ctx.fillText(document.body.classList.contains("touch") ? "Left stick move · right stick aim + attack · DASH button" : "WASD move · hold mouse to attack · Space dash · P / Esc pause", W / 2, H - 12);
}

// ============================================================
// MENUS
// ============================================================
function show(html) { ui.innerHTML = `<div class="panel">${html}</div>`; ui.classList.add("on"); }
function showMenu() {
  mode = "menu"; document.body.classList.remove("play");
  commit();
  const card = (wd, i) => {
    const open = i < S.unlocked, pr = S.prog[i], cl = S.cleared.includes(i);
    return `<button class="wcard ${cl ? "done" : ""}" data-act="world" data-w="${i}" ${open ? "" : "disabled"} style="border-color:${open ? wd.acc : "#2a3645"}">
      <b style="color:${open ? wd.acc : "#6b7a90"}">${open ? wd.name : "🔒 Locked"}</b><br><span class="muted">${open ? wd.era : "Defeat the boss of the world before"}</span>
      ${open ? `<br><span style="font-size:14px">${wd.forms[pr.stage]} · ${Math.floor(pr.xp)} XP${cl ? " · ✓ boss defeated" : ""}</span><br><span class="muted">${wd.forms.length} creatures · Boss: ${wd.boss.name}</span>` : ""}</button>`;
  };
  const cards = SECTIONS.map((sn, si) => `<h2 class="sec">${["🦴", "🌍", "🚀"][si]} ${sn}</h2><div class="wgrid">${WORLDS.map((wd, i) => wd.sec === si ? card(wd, i) : "").join("")}</div>`).join("");
  show(`<h1>PRIMORDIAL</h1>
    <p class="muted">Start as a single molecule and evolve. Defeat a world's boss to unlock the next one. Every world keeps its own evolution and XP — jump into any unlocked world whenever you want.</p>
    ${cards}
    <p class="muted">WASD / left stick move · hold mouse / right stick attack · Space / DASH · P / Esc pause</p>
    <button class="red" data-act="new">Erase all progress</button>`);
}
ui.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  switch (t.dataset.act) {
    case "world": startWorld(+t.dataset.w); break;
    case "select": showMenu(); break;
    case "new": if (confirm("Erase all progress?")) { S = freshS(); S.started = true; save(); showMenu(); } break;
    case "resume": togglePause(); break;
    case "menu": save(false); showMenu(); break;
  }
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
load(); showMenu();
requestAnimationFrame(loop);
</script>
