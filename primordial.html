<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primordial</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080c; color: #e8f4ff; font-family: system-ui, sans-serif; overflow: hidden; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 6px; cursor: crosshair; background: #0a1a1f; }
  #ui { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(4,8,12,.86); overflow: auto; }
  #ui.on { display: flex; }
  .panel { background: #101c24; border: 2px solid #2b5a63; border-radius: 14px; padding: 20px 28px; max-width: 700px; width: 90%; text-align: center; box-shadow: 0 0 40px #27ffd322; }
  h1 { margin: 4px 0 8px; letter-spacing: 4px; text-shadow: 0 0 16px #5dffd0; }
  .muted { color: #8eb0c4; font-size: 14px; }
  button { background: #1f8fd8; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 16px; cursor: pointer; margin: 4px; }
  button.big { font-size: 19px; padding: 13px 26px; background: #1fa862; }
  button.red { background: #b53b3b; }
  button:disabled { background: #2a3645; color: #6b7a90; }
  #touch { position: absolute; inset: 0; display: none; touch-action: none; }
  body.touch.play #touch { display: block; }
  .zone { position: absolute; bottom: 0; width: 50%; height: 70%; touch-action: none; }
  #zl { left: 0; } #zr { right: 0; }
  .base { position: absolute; width: 22vmin; height: 22vmin; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); display: none; transform: translate(-50%, -50%); }
  .knob { position: absolute; left: 50%; top: 50%; width: 9vmin; height: 9vmin; border-radius: 50%; background: rgba(255,255,255,.45); transform: translate(-50%, -50%); }
  #pauseBtn { position: absolute; right: 12px; top: 44px; display: none; z-index: 2; background: #101c24cc; border: 1px solid #2b5a63; padding: 6px 12px; font-size: 14px; margin: 0; }
  body.play #pauseBtn { display: block; }
  #dashBtn { top: 96px !important; position: absolute; right: 12px; top: 60px; width: 64px; height: 64px; border-radius: 50%; opacity: .75; padding: 0; font-size: 13px; }
  #toast { position: absolute; top: 12px; right: 16px; background: #1fa862; padding: 6px 12px; border-radius: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 3; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="touch">
    <div class="zone" id="zl"><div class="base"><div class="knob"></div></div></div>
    <div class="zone" id="zr"><div class="base"><div class="knob"></div></div></div>
    <button id="dashBtn">DASH</button>
  </div>
  <button id="pauseBtn">❚❚ Pause</button>
  <div id="ui"></div>
  <div id="toast">Saved</div>
</div></div>
<script>
// ============================================================
// DATA
// ============================================================
const W = 1280, H = 720, WW = 2600, WH = 1500;
const WORLDS = [
  { name: "Primordial Soup", era: "4 billion years ago", bg: ["#0b2a2e", "#06161a"], acc: "#5dffd0", foe: "#ff7a9a",
    forms: ["Molecule", "Protocell", "Bacterium", "Amoeba"], looks: ["molecule", "protocell", "bacterium", "amoeba"],
    facts: ["Chemistry before life: carbon molecules drifting in warm water.", "Fatty membranes wrap chemicals into the first cell-like bubbles.", "The first true cells. Simple, tiny and everywhere.", "A single-celled hunter that engulfs food with false feet."],
    boss: { name: "Paramecium Prime", hp: 650, spd: 70, col: "#d86bff", pat: "burst" } },
  { name: "Ancient Seas", era: "540 million years ago", bg: ["#0a2252", "#040b1f"], acc: "#6bd0ff", foe: "#ffb347",
    forms: ["Plankton", "Jellyfish", "Trilobite", "Lamprey"], looks: ["plankton", "jelly", "trilobite", "lamprey"],
    facts: ["Drifting algae and tiny animals: the base of the ocean food chain.", "Soft-bodied animals that sting prey with tentacles.", "Armoured arthropods with compound eyes ruled the Cambrian seabed.", "A jawless, backboned fish: an early vertebrate."],
    boss: { name: "Anomalocaris", hp: 1100, spd: 90, col: "#4a7bff", pat: "charge" } },
  { name: "Swamps & Shores", era: "400 million years ago", bg: ["#123d33", "#071a16"], acc: "#8affc0", foe: "#ffcf5a",
    forms: ["Armored Fish", "Lobe-finned Fish", "Tiktaalik", "Amphibian"], looks: ["fish", "lobefin", "tiktaalik", "amphibian"],
    facts: ["Jawed fish in bony armour, the first big predators with jaws.", "Fleshy, muscular fins that could bear weight.", "A fish with a neck, wrists and fingers-to-be: half fish, half land animal.", "Four legs, lungs and moist skin: life steps onto land."],
    boss: { name: "Dunkleosteus", hp: 1600, spd: 95, col: "#34c28a", pat: "charge" } },
  { name: "Age of Giants", era: "200 million years ago to today", bg: ["#3d2a14", "#1a1008"], acc: "#ffb86b", foe: "#ff5a5a",
    forms: ["Reptile", "Dinosaur", "Mammal", "Primate"], looks: ["reptile", "dino", "mammal", "primate"],
    facts: ["Scaly skin and shelled eggs free animals from the water.", "Fast, upright hunters. Their descendants still fly as birds.", "Warm-blooded, furry and small, hiding from giants and waiting.", "Grasping hands, big brains and tools. The road to humans."],
    boss: { name: "Tyrannosaurus Rex", hp: 2300, spd: 85, col: "#ff8a3d", pat: "stomp" } },
];
// Real-world style attacks only: no one in here shoots anything. Everything is contact, bites, lashes and slams.
const ATK = [
  [{ n: "Reaction burst", rng: 34, arc: 6.3, m: .9 }, { n: "Engulf", rng: 48, arc: 2.2, m: 1.1 }, { n: "Flagellum lash", rng: 60, arc: 1.2, m: 1.2 }, { n: "Pseudopod grab", rng: 80, arc: 1.6, m: 1.4 }],
  [{ n: "Toxin bloom", rng: 50, arc: 6.3, m: 1.0 }, { n: "Tentacle sting", rng: 74, arc: 2.8, m: 1.2 }, { n: "Claw pinch", rng: 60, arc: 1.0, m: 1.6 }, { n: "Sucker bite", rng: 66, arc: .9, m: 1.9 }],
  [{ n: "Armored bite", rng: 56, arc: 1.1, m: 1.4 }, { n: "Fin slap", rng: 66, arc: 2.0, m: 1.5 }, { n: "Snap bite", rng: 64, arc: 1.0, m: 1.8 }, { n: "Tongue lash", rng: 120, arc: .5, m: 1.7 }],
  [{ n: "Tail whip", rng: 70, arc: 2.4, m: 1.4 }, { n: "Claw slash", rng: 72, arc: 1.4, m: 1.8 }, { n: "Gnaw", rng: 54, arc: 1.0, m: 2.0 }, { n: "Club swing", rng: 92, arc: 2.2, m: 2.2 }],
];
const NEED = [50, 110, 190, 300];
const statsFor = (w, s) => ({
  r: 10 + s * 4 + w * 3,
  hp: (30 + 28 * s) * (1 + .7 * w),
  spd: 175 + s * 12 + w * 10,
  dmg: (6 + 2.2 * s) * (1 + .5 * w),
  cd: [.45, .36, .3, .2][s] * (1 - .08 * w),
  atk: ATK[w][s],
});

// ============================================================
// SAVE (same SAVE_KEY / JSON blob / try-catch pattern as the other games)
// ============================================================
const SAVE_KEY = "primordial-save-v1";
let S = { world: 0, stage: 0, xp: 0, kills: 0, started: false, done: false };
let toastTimer = null;
function toast() { const el = document.getElementById("toast"); el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1200); }
function save(show = true) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); if (show) toast(); } catch (e) {} }
function load() { try { const r = localStorage.getItem(SAVE_KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {} }

// ============================================================
// STATE
// ============================================================
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), ui = document.getElementById("ui");
let fact = "", factT = 0, mode = "menu", P, st, foes = [], shots = [], orbs = [], fx = [], boss = null, bossOn = false, spawnT = 0, msg = "", msgT = 0, flash = 0, shake = 0, saveT = 0, tm = 0;
const cam = { x: 0, y: 0 };
const keys = new Set(), mouse = { x: W / 2, y: H / 2, down: false };
const rnd = (a, b) => a + Math.random() * (b - a), dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const say = (t, d = 2) => { msg = t; msgT = d; };
const WD = () => WORLDS[S.world];

function startGame() {
  st = statsFor(S.world, S.stage);
  P = { x: WW / 2, y: WH / 2, vx: 0, vy: 0, hp: st.hp, face: 0, cd: 0, inv: 0, dash: 0, dashCd: 0, hitF: 0 };
  foes = []; shots = []; pulses = []; swing = null; orbs = []; fx = []; boss = null; bossOn = false; spawnT = 0;
  mode = "play"; document.body.classList.add("play"); ui.classList.remove("on");
  say(`${WD().name} — ${WD().era}`, 3); fact = `You are a ${WD().forms[S.stage]}. ${WD().facts[S.stage]}`; factT = 5;
}

// ============================================================
// ENEMIES
// ============================================================
function spawnFoe() {
  const w = S.world, s = S.stage, m = (1 + .45 * s) * (1 + .8 * w);
  const roll = Math.random();
  const type = roll < .4 ? "prey" : roll < (s >= 1 ? .85 : 1) ? "hunter" : "lunger";
  const base = { prey: [12, 10, 70, 0, 4], hunter: [22, 13, 100, 8, 7], lunger: [18, 12, 60, 12, 9] }[type];
  const a = rnd(0, 6.28), d = rnd(560, 800);
  foes.push({ type, x: Math.max(30, Math.min(WW - 30, P.x + Math.cos(a) * d)), y: Math.max(30, Math.min(WH - 30, P.y + Math.sin(a) * d)),
    fs: Math.max(0, Math.min(3, type === "prey" ? s - 1 : type === "hunter" ? s : s + 1)), hp: base[0] * m, max: base[0] * m, r: base[1] + s * 1.5, spd: base[2], dmg: base[3] * (1 + .5 * w) * (1 + .15 * s), xp: base[4] * (1 + .25 * w) * (1 + .1 * s),
    cd: rnd(.5, 2), ang: rnd(0, 6.28), t: rnd(0, 9), flash: 0 });
}
function spawnBoss() {
  const b = WD().boss;
  boss = { x: Math.max(200, Math.min(WW - 200, P.x + 700)), y: P.y > WH / 2 ? 300 : WH - 300, r: 62 + S.world * 12, hp: b.hp, max: b.hp, spd: b.spd, cd: 2, cd2: 6, state: "move", st: 0, flash: 0, dx: 0, dy: 0, t: 0 };
  bossOn = true; foes = foes.filter(f => f.type !== "lunger"); shake = .5;
  say(`${b.name} approaches!`, 3);
}
function updateBoss(dt) {
  const b = boss, pat = WD().boss.pat, rage = b.hp < b.max / 2 ? .7 : 1, w = S.world;
  const ang = Math.atan2(P.y - b.y, P.x - b.x);
  b.t += dt; b.cd -= dt; b.cd2 -= dt; b.flash -= dt;
  const dmgC = 18 + 8 * w;
  if (b.state === "charge") {
    b.x += b.dx * 480 * dt; b.y += b.dy * 480 * dt; b.st -= dt;
    if (b.st <= 0) { b.state = "move"; pulse(b.x, b.y, 280, 230, 10 + 4 * w); }
  } else if (b.state === "wind") {
    b.st -= dt; if (b.st <= 0) { b.state = "charge"; b.st = .75; const a = Math.atan2(P.y - b.y, P.x - b.x); b.dx = Math.cos(a); b.dy = Math.sin(a); }
  } else {
    b.x += Math.cos(ang) * b.spd * dt; b.y += Math.sin(ang) * b.spd * dt;
    if (pat === "burst" && b.cd <= 0) { b.cd = 2.2 * rage; pulse(b.x, b.y, 460, 240, 9 + 3 * w); }
    if (pat === "charge") { if (b.cd <= 0) { b.cd = 3.2 * rage; b.state = "wind"; b.st = .8; } if (b.cd2 <= 0) { b.cd2 = 2.6 * rage; pulse(b.x, b.y, 320, 260, 12); } }
    if (pat === "stomp") { if (b.cd <= 0) { b.cd = 3 * rage; pulse(b.x, b.y, 650, 210, 16); shake = .3; } if (b.cd2 <= 0) { b.cd2 = 4.2 * rage; b.state = "wind"; b.st = .6; } }
    if (pat === "burst" && b.cd2 <= 0) { b.cd2 = 7 * rage; for (let i = 0; i < 3; i++) spawnFoeAt(b.x + rnd(-80, 80), b.y + rnd(-80, 80), "hunter"); }
  }
  b.x = Math.max(b.r, Math.min(WW - b.r, b.x)); b.y = Math.max(b.r, Math.min(WH - b.r, b.y));
  if (dist(b, P) < b.r + 14) hurtP(dmgC);
  if (b.hp <= 0) bossDown();
}
function spawnFoeAt(x, y, type) { spawnFoe(); const f = foes[foes.length - 1]; f.x = x; f.y = y; f.type = type; if (type === "hunter") { f.hp = f.max = 22 * (1 + .45 * S.stage) * (1 + .8 * S.world); f.dmg = 8 * (1 + .5 * S.world); f.spd = 100; f.r = 13 + S.stage * 1.5; } }
function bossDown() {
  for (let i = 0; i < 60; i++) fx.push({ x: boss.x, y: boss.y, vx: rnd(-400, 400), vy: rnd(-400, 400), life: rnd(.5, 1.4), c: WD().boss.col });
  boss = null; bossOn = false; foes = []; shots = []; flash = .6; shake = .8;
  mode = "won"; document.body.classList.remove("play");
  const last = S.world === WORLDS.length - 1;
  setTimeout(() => {
    if (mode !== "won") return;
    if (last) { S.done = true; save(); show(`<h1>YOU EVOLVED!</h1><p>You defeated ${WORLDS[S.world].boss.name}. From a molecule in the soup, through plankton, fish and amphibians, to dinosaurs, mammals and primates — four billion years of evolution, and you came out on top.</p><button class="big" data-act="again">Play again from the soup</button> <button data-act="menu">Menu</button>`); }
    else { S.world++; S.stage = 0; S.xp = 0; save(); show(`<h1>WORLD CLEARED</h1><p>${WORLDS[S.world - 1].boss.name} is defeated. A new world opens: <b>${WORLDS[S.world].name}</b>. You start over as a ${WORLDS[S.world].forms[0]} — evolve again!</p><button class="big" data-act="go">Enter ${WORLDS[S.world].name}</button>`); }
  }, 1600);
}

// ============================================================
// PLAYER
// ============================================================
function hurtP(d) {
  if (P.inv > 0 || P.dash > 0 || mode !== "play") return;
  P.hp -= d; P.inv = .5; P.hitF = .15; shake = .2;
  if (P.hp <= 0) die();
}
function die() {
  for (let i = 0; i < 30; i++) fx.push({ x: P.x, y: P.y, vx: rnd(-300, 300), vy: rnd(-300, 300), life: .8, c: WD().acc });
  S.xp = Math.floor(S.xp * .5); save(false);
  say("You were eaten! Lost half your XP.", 2.5);
  P.x = WW / 2; P.y = WH / 2; P.hp = st.hp; P.inv = 2; shots = []; foes = foes.filter(f => dist(f, P) > 500);
  if (boss) { boss.hp = boss.max; boss.x = Math.max(200, Math.min(WW - 200, P.x + 700)); boss.y = 300; boss.state = "move"; }
}
function gainXp(n) {
  if (bossOn) return;
  S.xp += n;
  if (S.xp >= NEED[S.stage] * (1 + .3 * S.world)) {
    if (S.stage < 3) evolve();
    else if (!bossOn) { S.xp = NEED[3] * (1 + .3 * S.world); spawnBoss(); }
  }
}
function evolve() {
  S.stage++; S.xp = 0; st = statsFor(S.world, S.stage); P.hp = st.hp; P.inv = 1.5;
  for (let i = 0; i < 40; i++) fx.push({ x: P.x, y: P.y, vx: Math.cos(i) * rnd(100, 420), vy: Math.sin(i) * rnd(100, 420), life: rnd(.5, 1.2), c: "#fff" });
  flash = .5; say(`EVOLVED → ${WD().forms[S.stage]}!`, 4); fact = WD().facts[S.stage]; factT = 5; save();
}
let swing = null, pulses = [];
function attack() {
  P.cd = st.cd;
  const A = st.atk, reach = A.rng + st.r, full = A.arc >= 6;
  swing = { t: .16, ang: P.face, reach, arc: A.arc };
  const inArc = (o, rad) => {
    const d = dist(P, o); if (d > reach + rad) return false;
    if (full) return true;
    let da = Math.atan2(o.y - P.y, o.x - P.x) - P.face; da = Math.atan2(Math.sin(da), Math.cos(da));
    return Math.abs(da) <= A.arc / 2 || d < rad + st.r;
  };
  const dmg = st.dmg * A.m * 1.8;
  for (const f of foes) if (inArc(f, f.r)) { f.hp -= dmg; f.flash = .1; const a = Math.atan2(f.y - P.y, f.x - P.x); f.x += Math.cos(a) * 18; f.y += Math.sin(a) * 18; }
  if (boss && inArc(boss, boss.r)) { boss.hp -= dmg; boss.flash = .08; }
}
function pulse(x, y, max, spd, d) { pulses.push({ x, y, r: 10, max, spd, d, hit: false }); }

// ============================================================
// INPUT
// ============================================================
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["w", "a", "s", "d", " ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
  if (k === " " && !e.repeat) dash();
  if ((k === "escape" || k === "p") && !e.repeat) togglePause();
  keys.add(k);
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
function setMouse(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * W / r.width; mouse.y = (e.clientY - r.top) * H / r.height; }
cv.addEventListener("mousemove", setMouse);
cv.addEventListener("mousedown", e => { setMouse(e); mouse.down = true; });
addEventListener("mouseup", () => mouse.down = false);
function togglePause() {
  if (mode === "play") { mode = "pause"; keys.clear(); mouse.down = false; show(`<h1>PAUSED</h1><p class="muted">${WD().name} · ${WD().forms[S.stage]}</p><button class="big" data-act="resume">Resume</button> <button data-act="menu">Main menu</button>`); }
  else if (mode === "pause") { mode = "play"; ui.classList.remove("on"); }
}
document.getElementById("pauseBtn").addEventListener("click", e => { e.stopPropagation(); togglePause(); });
addEventListener("blur", () => { if (mode === "play") togglePause(); });
function dash() {
  if (mode !== "play" || P.dashCd > 0) return;
  let dx = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0), dy = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
  if (joy.l && Math.hypot(joy.l.dx, joy.l.dy) > .2) { dx = joy.l.dx; dy = joy.l.dy; }
  if (!dx && !dy) { dx = Math.cos(P.face); dy = Math.sin(P.face); }
  const l = Math.hypot(dx, dy); P.dvx = dx / l * 650; P.dvy = dy / l * 650; P.dash = .18; P.dashCd = 1.1;
}
const joy = { l: null, r: null };
function setupStick(id, key) {
  const z = document.getElementById(id), base = z.querySelector(".base"), knob = z.querySelector(".knob"), R = 60;
  z.addEventListener("pointerdown", e => {
    if (joy[key]) return; document.body.classList.add("touch");
    const zr = z.getBoundingClientRect(); joy[key] = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
    base.style.display = "block"; base.style.left = (e.clientX - zr.left) + "px"; base.style.top = (e.clientY - zr.top) + "px"; knob.style.transform = "translate(-50%,-50%)";
    z.setPointerCapture(e.pointerId); e.preventDefault();
  });
  z.addEventListener("pointermove", e => { const j = joy[key]; if (!j || j.id !== e.pointerId) return; const d = Math.hypot(e.clientX - j.ox, e.clientY - j.oy) || 1, k = Math.min(1, d / R); j.dx = (e.clientX - j.ox) / d * k; j.dy = (e.clientY - j.oy) / d * k; knob.style.transform = `translate(calc(-50% + ${j.dx * R}px), calc(-50% + ${j.dy * R}px))`; });
  const end = e => { const j = joy[key]; if (j && j.id === e.pointerId) { joy[key] = null; base.style.display = "none"; } };
  z.addEventListener("pointerup", end); z.addEventListener("pointercancel", end);
}
setupStick("zl", "l"); setupStick("zr", "r");
document.getElementById("dashBtn").addEventListener("pointerdown", e => { e.preventDefault(); dash(); });
addEventListener("touchstart", () => document.body.classList.add("touch"), { once: true, passive: true });
if (matchMedia && matchMedia("(pointer: coarse)").matches) document.body.classList.add("touch");

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  tm += dt;
  if (mode !== "play" && mode !== "won") return;
  if (mode === "won") { stepFx(dt); return; }
  // movement
  let dx = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0), dy = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
  if (joy.l && Math.hypot(joy.l.dx, joy.l.dy) > .1) { dx = joy.l.dx; dy = joy.l.dy; }
  const l = Math.hypot(dx, dy) || 1, k = Math.min(1, Math.hypot(dx, dy));
  const tvx = dx / l * k * st.spd, tvy = dy / l * k * st.spd;
  P.vx += (tvx - P.vx) * Math.min(1, dt * 9); P.vy += (tvy - P.vy) * Math.min(1, dt * 9);
  if (P.dash > 0) { P.dash -= dt; P.x += P.dvx * dt; P.y += P.dvy * dt; } else { P.x += P.vx * dt; P.y += P.vy * dt; }
  P.x = Math.max(st.r, Math.min(WW - st.r, P.x)); P.y = Math.max(st.r, Math.min(WH - st.r, P.y));
  cam.x = Math.max(0, Math.min(WW - W, P.x - W / 2)); cam.y = Math.max(0, Math.min(WH - H, P.y - H / 2));
  P.cd -= dt; P.inv -= dt; P.dashCd -= dt; P.hitF -= dt;
  // aim / fire
  let firing = false;
  if (joy.r && Math.hypot(joy.r.dx, joy.r.dy) > .2) { P.face = Math.atan2(joy.r.dy, joy.r.dx); firing = true; }

  ctx.fillStyle = "#222"; ctx.fillRect(16, 56, 260, 10); ctx.fillStyle = bossOn ? "#888" : wd.acc; ctx.fillRect(16, 56, 260 * Math.min(1, S.xp / need), 10);
  ctx.font = "12px system-ui"; ctx.fillStyle = "#cfe8ff";
  ctx.fillText(S.stage < 3 ? `XP → ${wd.forms[S.stage + 1]}` : (bossOn ? "BOSS FIGHT" : "XP → BOSS"), 16, 82);
  let cx = 16; ctx.textAlign = "left"; ctx.font = "bold 12px system-ui";
  wd.forms.forEach((n, i) => { ctx.fillStyle = i === S.stage ? wd.acc : i < S.stage ? "#7a9aa8" : "#4a5a66"; const t2 = (i ? " › " : "") + n; ctx.fillText(t2, cx, 100); cx += ctx.measureText(t2).width; });
  ctx.textAlign = "right"; ctx.font = "12px system-ui"; ctx.fillStyle = "#cfe8ff"; ctx.fillText(`kills ${S.kills} · dash ${P.dashCd > 0 ? Math.ceil(P.dashCd * 10) / 10 + "s" : "ready"}`, W - 16, 24);
  if (boss) {
    const bw = 520, bx = W / 2 - bw / 2;
    ctx.textAlign = "center"; ctx.font = "bold 18px system-ui"; ctx.fillStyle = "#fff"; ctx.fillText(wd.boss.name, W / 2, 28);
    ctx.fillStyle = "#222"; ctx.fillRect(bx, 36, bw, 14); ctx.fillStyle = wd.boss.col; ctx.fillRect(bx, 36, bw * Math.max(0, boss.hp / boss.max), 14);
  }
  if (msgT > 0) { ctx.textAlign = "center"; ctx.font = "bold 30px system-ui"; ctx.fillStyle = "#fff"; ctx.globalAlpha = Math.min(1, msgT); ctx.fillText(msg, W / 2, 130); ctx.globalAlpha = 1; }
  if (factT > 0) { ctx.textAlign = "center"; ctx.font = "15px system-ui"; ctx.fillStyle = "#cfe8ff"; ctx.globalAlpha = Math.min(1, factT); ctx.fillText(fact, W / 2, 162); ctx.globalAlpha = 1; }
  ctx.textAlign = "center"; ctx.font = "13px system-ui"; ctx.fillStyle = "rgba(255,255,255,.45)";
  ctx.fillText(document.body.classList.contains("touch") ? "Left stick move · right stick aim + attack · DASH button" : "WASD move · hold mouse to attack · Space dash · P / Esc pause", W / 2, H - 12);
}

// ============================================================
// MENUS
// ============================================================
function show(html) { ui.innerHTML = `<div class="panel">${html}</div>`; ui.classList.add("on"); }
function showMenu() {
  mode = "menu"; document.body.classList.remove("play");
  const has = S.started || S.xp > 0 || S.stage > 0 || S.world > 0;
  show(`<h1>PRIMORDIAL</h1>
    <p class="muted">You begin as a single molecule in a world of goo. Fight, grow, and evolve — then defeat the boss to reach the next world.</p>
    <p class="muted">WASD move · hold the mouse to attack · Space dash · P / Esc pause</p>
    ${has ? `<p><b>Progress:</b> ${WORLDS[S.world].name} — ${WORLDS[S.world].forms[S.stage]}</p><button class="big" data-act="go">Continue</button> <button class="red" data-act="new">New game</button>` : '<button class="big" data-act="go">Begin</button>'}`);
}
ui.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  switch (t.dataset.act) {
    case "go": S.started = true; startGame(); break;
    case "new": case "again": S = { world: 0, stage: 0, xp: 0, kills: 0, started: true, done: false }; save(); startGame(); break;
    case "resume": togglePause(); break;
    case "menu": showMenu(); break;
  }
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
load(); showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
